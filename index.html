/* ============ طبقة الاتصال بقاعدة البيانات ============ */
async function fetchTable(table) {
  const { data, error } = await supabase.from(table).select("*").order("id", { ascending: true });
  if (error) { console.error(table, error); return []; }
  return data || [];
}
async function insertRow(table, row) {
  const { data, error } = await supabase.from(table).insert(row).select();
  if (error) throw error;
  return data[0];
}
async function updateRow(table, id, patch) {
  const { error } = await supabase.from(table).update(patch).eq("id", id);
  if (error) throw error;
}
async function deleteRow(table, id) {
  const { error } = await supabase.from(table).delete().eq("id", id);
  if (error) throw error;
}
async function getSetting(key, fallback) {
  const { data } = await supabase.from("settings").select("value").eq("key", key).maybeSingle();
  return data ? data.value : fallback;
}
async function setSetting(key, value) {
  await supabase.from("settings").upsert({ key, value });
}

/* ============ حسابات لوحة التحكم ============ */
function computeSourceSummary(rows) {
  const bags = rows.bags || [], boxes = rows.boxes || [], sales = rows.sales || [], nafia = rows.nafia || [], costs = rows.costs || [], purchases = rows.purchases || [];
  const purchasedBoxes = purchases.filter((r) => r.method === "بالصندوق").reduce((s, r) => s + num(r.qty), 0);
  const purchasedPalms = purchases.filter((r) => r.method === "بالنخلة").reduce((s, r) => s + num(r.qty), 0);
  const bySource = (source) => {
    const bagsCount = bags.filter((r) => r.source === source).reduce((s, r) => s + num(r.bag_count), 0);
    const boxesCount = boxes.filter((r) => r.source === source).reduce((s, r) => s + num(r.box_count), 0);
    const salesRev = sales.filter((r) => r.source === source).reduce((s, r) => s + num(r.qty) * num(r.unit_price), 0);
    const nafiaRev = nafia.filter((r) => r.source === source).reduce((s, r) => s + num(r.qty_sacks) * num(r.unit_price), 0);
    const cost = costs.filter((r) => r.source === source).reduce((s, r) => s + num(r.amount), 0);
    return { bagsCount, boxes: boxesCount, purchasedBoxes: source === "تمور مشتراة" ? purchasedBoxes : 0, purchasedPalms: source === "تمور مشتراة" ? purchasedPalms : 0, salesRev, nafiaRev, cost, net: salesRev + nafiaRev - cost };
  };
  return { farm: bySource("إنتاج المزرعة"), bought: bySource("تمور مشتراة") };
}
function computeDash(rows) {
  const bags = rows.bags || [], boxes = rows.boxes || [], sales = rows.sales || [], nafia = rows.nafia || [], gifts = rows.gifts || [], costs = rows.costs || [];
  const bagsFarm = bags.filter((r) => r.source === "إنتاج المزرعة").reduce((s, r) => s + num(r.bag_count), 0);
  const bagsBought = bags.filter((r) => r.source === "تمور مشتراة").reduce((s, r) => s + num(r.bag_count), 0);
  const boxesFarm = boxes.filter((r) => r.source === "إنتاج المزرعة").reduce((s, r) => s + num(r.box_count), 0);
  const boxesBought = boxes.filter((r) => r.source === "تمور مشتراة").reduce((s, r) => s + num(r.box_count), 0);
  const totalDibs = boxes.reduce((s, r) => s + (r.box_count && r.box_weight ? num(r.box_count) * num(r.box_weight) : 0), 0);
  const nafiaSacks = nafia.reduce((s, r) => s + num(r.qty_sacks), 0);
  const salesRevenue = sales.reduce((s, r) => s + num(r.qty) * num(r.unit_price), 0);
  const nafiaRevenue = nafia.reduce((s, r) => s + num(r.qty_sacks) * num(r.unit_price), 0);
  const totalRevenue = salesRevenue + nafiaRevenue;
  const totalCosts = costs.reduce((s, r) => s + num(r.amount), 0);
  const totalBags = bagsFarm + bagsBought, totalBoxes = boxesFarm + boxesBought;
  return {
    bagsFarm, bagsBought, boxesFarm, boxesBought, totalDibs, nafiaSacks, salesRevenue, nafiaRevenue,
    totalRevenue, totalCosts, netProfit: totalRevenue - totalCosts,
    avgBoxesPerBag: totalBags > 0 ? totalBoxes / totalBags : 0,
    totalGiftBoxes: gifts.reduce((s, r) => s + num(r.qty), 0),
  };
}

        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 20 }}>تسجيل دخول صاحب النظام</div>
        <form onSubmit={submit}>
          <div style={{ display: "grid", gap: 12 }}>
            <input type="email" required placeholder="البريد الإلكتروني" value={email} onChange={(e) => setEmail(e.target.value)} style={inputStyle} />
            <input type="password" required placeholder="كلمة المرور" value={password} onChange={(e) => setPassword(e.target.value)} style={inputStyle} />
          </div>
          {error && <div style={{ color: COLORS.alert, fontSize: 12.5, marginTop: 10 }}>{error}</div>}
          <button type="submit" disabled={loading} style={{ ...primaryBtnStyle, width: "100%", marginTop: 16, padding: "11px 16px" }}>
            {loading ? "جارٍ الدخول…" : "دخول"}
          </button>
        </form>
      </div>

/* ============ نموذج طلب العميل العام (بدون تسجيل دخول) ============ */

const EMIRATES = ["رأس الخيمة", "أبوظبي", "دبي", "الشارقة", "عجمان", "أم القيوين", "الفجيرة"];

function CustomerOrderForm() {
  const [form, setForm] = useState({
    first_name: "", last_name: "", phone: "", qty: "",
    fulfillment: "استلام", emirate: "", area: "", delivery_location: "", house_number: "", notes: "",
  });
  const [status, setStatus] = useState("idle");
  const [errMsg, setErrMsg] = useState("");
  const [ordersOpen, setOrdersOpen] = useState(null);
  const [fees, setFees] = useState({ rak: 30, other: 60 });

  useEffect(() => {
    (async () => {
      const { data } = await supabase.from("settings").select("key,value").in("key", ["orders_open", "delivery_fee_rak", "delivery_fee_other"]);
      let open = true, rak = 30, other = 60;
      (data || []).forEach((r) => {
        if (r.key === "orders_open") open = r.value !== false && r.value !== "false";
        if (r.key === "delivery_fee_rak") rak = num(r.value);
        if (r.key === "delivery_fee_other") other = num(r.value);
      });
      setFees({ rak: rak || 30, other: other || 60 });
      setOrdersOpen(open);
    })();
  }, []);

  const deliveryFee = form.fulfillment !== "توصيل" ? 0
    : form.emirate === "رأس الخيمة" ? fees.rak
    : form.emirate ? fees.other : 0;
  const boxesTotal = num(form.qty) * DEFAULT_BOX_PRICE;
  const grandTotal = boxesTotal + deliveryFee;

  const submit = async (e) => {
    e.preventDefault();
    if (!form.first_name.trim() || !form.qty) return;
    setStatus("saving");
    try {
      const payload = {
        name: `${form.first_name} ${form.last_name}`.trim(),
        first_name: form.first_name, last_name: form.last_name,
        phone: form.phone, qty: num(form.qty), notes: form.notes,
        fulfillment: form.fulfillment, delivery_fee: deliveryFee,
      };
      if (form.fulfillment === "توصيل") {
        payload.emirate = form.emirate;
        payload.area = form.area;
        payload.delivery_location = form.delivery_location;
        payload.house_number = form.house_number;
      }
      const { error } = await supabase.from("incoming_orders").insert(payload);
      if (error) { console.error(error); setErrMsg(error.message || "تعذّر إرسال الطلب"); setStatus("error"); return; }
      setStatus("done");
    } catch (err) {
      console.error(err); setErrMsg(String(err && err.message ? err.message : err)); setStatus("error");
    }
  };

  const card = { maxWidth: 460, width: "100%", background: COLORS.surface, borderRadius: 18, padding: 24, border: `1px solid ${COLORS.line}` };
  const wrap = { minHeight: "100vh", background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 };

  if (ordersOpen === null) {
    return <div dir="rtl" style={wrap}><div style={{ color: COLORS.inkSoft }}>جارٍ التحميل…</div></div>;
  }

  if (!ordersOpen) {
    return (
      <div dir="rtl" style={wrap}>
        <div style={{ ...card, textAlign: "center" }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>🌴</div>
          <div style={{ fontFamily: "Cairo, sans-serif", fontWeight: 800, fontSize: 18, color: COLORS.deep, marginBottom: 8 }}>
            نفذت الكمية حالياً
          </div>
          <div style={{ fontSize: 13.5, color: COLORS.inkSoft, lineHeight: 1.9 }}>
            نعتذر، استقبال الطلبات متوقف مؤقتاً لحين توفر إنتاج جديد.
            <br />نشكر لكم اهتمامكم، وسنستقبل طلباتكم فور توفر الكمية بإذن الله.
          </div>
        </div>
      </div>
    );
  }

  return (
    <div dir="rtl" style={wrap}>
      <div style={card}>
        <div style={{ marginBottom: 16 }}>
          <LogoLockup size={50} center />
        </div>
        <div style={{ borderRadius: 14, overflow: "hidden", marginBottom: 16, position: "relative" }}>
          <img src="pour.jpeg" alt="دبس التمر" style={{ width: "100%", height: 170, objectFit: "cover", display: "block" }} />
          <span style={{ position: "absolute", top: 10, insetInlineStart: 10, background: "rgba(107,122,58,.92)", color: "#fff", borderRadius: 20, padding: "4px 12px", fontSize: 11, fontWeight: 800, letterSpacing: 1 }}>
            🌿 ORGANIC
          </span>
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6, flexWrap: "wrap", gap: 8 }}>
          <div style={{ fontFamily: "Cairo, sans-serif", fontWeight: 800, fontSize: 18, color: COLORS.deep }}>تسجيل طلب دبس</div>
        </div>
        <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 14, lineHeight: 1.8 }}>
          دبس تمر من نخيل المزرعة — مكوّن واحد فقط: التمر.
        </div>
        <a href="#story" style={{
          display: "block", textDecoration: "none", marginBottom: 18,
          background: COLORS.amberLight, borderRadius: 12, padding: "10px 14px",
          fontSize: 12.5, color: COLORS.deep, fontWeight: 700,
        }}>
          🌴 تعرّف على رحلة المنتج — من النخلة للمدبسة ←
        </a>

        {status === "done" ? (
          <div style={{ textAlign: "center", padding: "24px 8px" }}>
            <div style={{ fontSize: 40, marginBottom: 10 }}>✅</div>
            <div style={{ fontFamily: "Cairo, sans-serif", fontWeight: 700, fontSize: 16, color: COLORS.deep }}>تم استلام طلبك بنجاح</div>
            <div style={{ fontSize: 13, color: COLORS.inkSoft, marginTop: 6, lineHeight: 1.9 }}>
              سيتم التواصل معك لتأكيد الطلب، وتحديد موعد التسليم حسب توفر الإنتاج.
            </div>
          </div>
        ) : (
          <form onSubmit={submit}>
            <div style={{ display: "grid", gap: 12 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <label style={{ fontSize: 12.5, color: COLORS.inkSoft }}>الاسم
                  <input required value={form.first_name} onChange={(e) => setForm((f) => ({ ...f, first_name: e.target.value }))} style={{ ...inputStyle, marginTop: 4 }} />
                </label>
                <label style={{ fontSize: 12.5, color: COLORS.inkSoft }}>اللقب
                  <input value={form.last_name} onChange={(e) => setForm((f) => ({ ...f, last_name: e.target.value }))} style={{ ...inputStyle, marginTop: 4 }} />
                </label>
              </div>

              <label style={{ fontSize: 12.5, color: COLORS.inkSoft }}>رقم التواصل (واتساب)
                <input value={form.phone} onChange={(e) => setForm((f) => ({ ...f, phone: e.target.value }))} placeholder="مثال: 0501234567" style={{ ...inputStyle, marginTop: 4 }} />
              </label>

              <label style={{ fontSize: 12.5, color: COLORS.inkSoft }}>الكمية المطلوبة (عدد العلب)
                <input required type="number" min="1" value={form.qty} onChange={(e) => setForm((f) => ({ ...f, qty: e.target.value }))} style={{ ...inputStyle, marginTop: 4 }} />
              </label>
              <div style={{ fontSize: 11.5, color: COLORS.inkSoft }}>العلبة الواحدة {BOX_SIZE_KG} كجم (منّ) بسعر {DEFAULT_BOX_PRICE} درهم.</div>

              <div>
                <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 6 }}>طريقة الاستلام</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  {["استلام", "توصيل"].map((opt) => (
                    <button key={opt} type="button" onClick={() => setForm((f) => ({ ...f, fulfillment: opt }))}
                      style={{
                        padding: "10px 8px", borderRadius: 10, cursor: "pointer", fontSize: 13, fontWeight: 700,
                        border: `1px solid ${form.fulfillment === opt ? COLORS.primary : COLORS.line}`,
                        background: form.fulfillment === opt ? COLORS.primary : "#fff",
                        color: form.fulfillment === opt ? "#fff" : COLORS.inkSoft,
                      }}>
                      {opt === "استلام" ? "🏠 استلام من المزرعة" : "🚚 توصيل"}
                    </button>
                  ))}
                </div>
              </div>

              {form.fulfillment === "توصيل" && (
                <div style={{ display: "grid", gap: 10, background: COLORS.amberLight, padding: 12, borderRadius: 12 }}>
                  <label style={{ fontSize: 12.5, color: COLORS.deep }}>الإمارة
                    <select required value={form.emirate} onChange={(e) => setForm((f) => ({ ...f, emirate: e.target.value }))} style={{ ...inputStyle, marginTop: 4 }}>
                      <option value="">— اختر —</option>
                      {EMIRATES.map((em) => <option key={em} value={em}>{em}</option>)}
                    </select>
                  </label>
                  <label style={{ fontSize: 12.5, color: COLORS.deep }}>المنطقة
                    <input required value={form.area} onChange={(e) => setForm((f) => ({ ...f, area: e.target.value }))} style={{ ...inputStyle, marginTop: 4 }} />
                  </label>
                  <label style={{ fontSize: 12.5, color: COLORS.deep }}>رقم المنزل / الفيلا
                    <input required value={form.house_number} onChange={(e) => setForm((f) => ({ ...f, house_number: e.target.value }))} style={{ ...inputStyle, marginTop: 4 }} />
                  </label>
                  <label style={{ fontSize: 12.5, color: COLORS.deep }}>وصف الموقع أو رابط الموقع (اختياري)
                    <input value={form.delivery_location} onChange={(e) => setForm((f) => ({ ...f, delivery_location: e.target.value }))} placeholder="رابط خرائط جوجل أو وصف" style={{ ...inputStyle, marginTop: 4 }} />
                  </label>
                  {form.emirate && (
                    <div style={{ fontSize: 12, color: COLORS.deep, fontWeight: 700 }}>
                      رسوم التوصيل: {fmt(deliveryFee)} درهم
                    </div>
                  )}
                </div>
              )}

              <label style={{ fontSize: 12.5, color: COLORS.inkSoft }}>ملاحظات (اختياري)
                <input value={form.notes} onChange={(e) => setForm((f) => ({ ...f, notes: e.target.value }))} style={{ ...inputStyle, marginTop: 4 }} />
              </label>

              {num(form.qty) > 0 && (
                <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 12, fontSize: 13 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                    <span style={{ color: COLORS.inkSoft }}>{fmt(num(form.qty))} علبة × {DEFAULT_BOX_PRICE}</span>
                    <span>{fmt(boxesTotal)}</span>
                  </div>
                  {deliveryFee > 0 && (
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                      <span style={{ color: COLORS.inkSoft }}>رسوم التوصيل</span>
                      <span>{fmt(deliveryFee)}</span>
                    </div>
                  )}
                  <div style={{ display: "flex", justifyContent: "space-between", borderTop: `1px solid ${COLORS.line}`, paddingTop: 6, marginTop: 6, fontWeight: 800, color: COLORS.deep }}>
                    <span>الإجمالي</span>
                    <span>{fmt(grandTotal)} درهم</span>
                  </div>
                </div>
              )}
            </div>

            {status === "error" && <div style={{ color: COLORS.alert, fontSize: 12.5, marginTop: 10 }}>{errMsg || "حدث خطأ، حاول مرة أخرى."}</div>}
            <button type="submit" disabled={status === "saving"} style={{ ...primaryBtnStyle, width: "100%", marginTop: 16, padding: "11px 16px" }}>
              {status === "saving" ? "جارٍ الإرسال…" : "إرسال الطلب"}
            </button>
          </form>
        )}
      </div>
    </div>
  );
}

/* ============ التطبيق الرئيسي (بعد تسجيل الدخول) ============ */
function MainApp({ session }) {
  const [tab, setTab] = useState("dashboard");
  const [data, setData] = useState({ bags: [], boxes: [], purchases: [], orders: [], sales: [], nafia: [], gifts: [], costs: [], withdrawals: [], partners: [] });
  const [incoming, setIncoming] = useState([]);
  const [ordersOpen, setOrdersOpen] = useState(true);
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState(null);
  const showToast = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); }, []);

  const loadAll = useCallback(async () => {
    const keys = Object.keys(TABLES);
    const results = await Promise.all(keys.map((k) => fetchTable(TABLES[k].table)));
    const next = {};
    keys.forEach((k, i) => (next[k] = results[i]));
    next.withdrawals = await fetchTable("withdrawals");
    next.partners = await fetchTable("partners");
    if (next.partners.length === 0) {
      const defaults = [{ name: "حسن", pct: 33.333 }, { name: "أحمد", pct: 33.333 }, { name: "عزيز وناصر", pct: 33.334 }];
      for (const p of defaults) await insertRow("partners", p);
      next.partners = await fetchTable("partners");
    }
    setData(next);
    const { data: inc } = await supabase.from("incoming_orders").select("*").eq("status", "pending").order("submitted_at", { ascending: true });
    setIncoming(inc || []);
    const openVal = await getSetting("orders_open", true);
    setOrdersOpen(openVal !== false && openVal !== "false");
    setLoaded(true);
  }, []);

  const toggleOrders = async () => {
    const next = !ordersOpen;
    await setSetting("orders_open", next);
    setOrdersOpen(next);
    showToast(next ? "تم فتح استقبال الطلبات" : "تم إيقاف استقبال الطلبات");
  };

  useEffect(() => { loadAll(); }, [loadAll]);

  const computedRows = useMemo(() => {
    const out = {};
    for (const key of Object.keys(TABLES)) out[key] = (data[key] || []).map((r) => TABLES[key].computed(r, data));
    return out;
  }, [data]);

  const dash = useMemo(() => computeDash(computedRows), [computedRows]);
  const sourceSummary = useMemo(() => computeSourceSummary(computedRows), [computedRows]);

  const partnersDistribution = useMemo(() => {
    const netFarm = sourceSummary.farm.net;
    const partners = data.partners || [];
    const pctSum = partners.reduce((s, p) => s + num(p.pct), 0);
    const withdrawals = data.withdrawals || [];
    const valueOf = (w) => (w.type === "علب دبس" ? num(w.qty) * DEFAULT_BOX_PRICE : num(w.amount));
    return {
      netFarm, pctSum,
      rows: partners.map((p) => {
        const share = netFarm * (num(p.pct) / 100);
        const withdrawn = withdrawals.filter((w) => w.partner_name === p.name).reduce((s, w) => s + valueOf(w), 0);
        return { ...p, share, withdrawn, remaining: share - withdrawn };
      }),
    };
  }, [data.partners, data.withdrawals, sourceSummary]);

  const acceptIncoming = async (item) => {
    const notesParts = [];
    if (item.notes) notesParts.push(item.notes);
    if (item.phone) notesParts.push(`هاتف: ${item.phone}`);
    notesParts.push(item.fulfillment === "توصيل" ? "توصيل" : "استلام");
    if (item.fulfillment === "توصيل") {
      const addr = [item.emirate, item.area, item.house_number ? `منزل ${item.house_number}` : "", item.delivery_location]
        .filter(Boolean).join(" - ");
      if (addr) notesParts.push(addr);
      if (num(item.delivery_fee) > 0) notesParts.push(`رسوم توصيل: ${fmt(num(item.delivery_fee))}`);
    }
    notesParts.push("(عبر الرابط الإلكتروني)");
    await insertRow("orders", { order_date: todayISO(), customer_name: item.name, qty_requested: item.qty, notes: notesParts.join(" — ") });
    await supabase.from("incoming_orders").update({ status: "accepted" }).eq("id", item.id);
    setIncoming((list) => list.filter((x) => x.id !== item.id));
    await loadAll();
    showToast("تمت إضافة الطلب");
  };
  const rejectIncoming = async (item) => {
    await supabase.from("incoming_orders").update({ status: "rejected" }).eq("id", item.id);
    setIncoming((list) => list.filter((x) => x.id !== item.id));
    showToast("تم تجاهل الطلب");
  };

  const logout = async () => { await supabase.auth.signOut(); };

  if (!loaded) {
    return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.bg }}><div style={{ color: COLORS.inkSoft }}>جارِ تحميل البيانات…</div></div>;
  }

  return (
    <div dir="rtl" style={{ minHeight: "100vh", background: COLORS.bg, color: COLORS.ink }}>
      <header style={{ background: `linear-gradient(135deg, ${COLORS.deep}, #3A1C0C)`, color: "#F3E9D8", padding: "20px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <LogoMark size={42} light />
          <div>
            <div style={{ fontFamily: "Cairo, sans-serif", fontWeight: 800, fontSize: 19 }}>{BRAND_NAME}</div>
            <div style={{ fontSize: 11.5, color: "#D8C4A8" }}>{session.user.email}</div>
          </div>
        </div>
        <button onClick={logout} style={{ ...ghostBtnStyle, background: "rgba(255,255,255,.1)", color: "#F3E9D8", border: "1px solid rgba(255,255,255,.25)" }}>تسجيل خروج</button>
      </header>

      <nav style={{ background: COLORS.surface, borderBottom: `1px solid ${COLORS.line}`, overflowX: "auto", position: "sticky", top: 0, zIndex: 5 }}>
        <div style={{ display: "flex", gap: 4, padding: "6px 12px" }}>
          {TAB_ORDER.map((key) => {
            const meta = TABLES[key] ? { label: TABLES[key].label, icon: TABLES[key].icon } : TAB_META[key];
            const active = tab === key;
            const badge = key === "orders" && incoming.length > 0 ? incoming.length : 0;
            return (
              <button key={key} onClick={() => setTab(key)} style={{ position: "relative", flex: "0 0 auto", padding: "9px 14px", borderRadius: 10, border: "none", cursor: "pointer", fontSize: 13.5, fontWeight: active ? 700 : 500, background: active ? COLORS.primary : "transparent", color: active ? "#fff" : COLORS.inkSoft }}>
                {meta.icon} {meta.label}
                {badge > 0 && (
                  <span style={{
                    position: "absolute", top: 2, insetInlineEnd: 2, minWidth: 18, height: 18,
                    borderRadius: 9, background: COLORS.alert, color: "#fff", fontSize: 11, fontWeight: 800,
                    display: "inline-flex", alignItems: "center", justifyContent: "center", padding: "0 5px",
                  }}>{badge}</span>
                )}
              </button>
            );
          })}
        </div>
      </nav>

      <main style={{ maxWidth: 1100, margin: "0 auto", padding: "18px 16px 60px" }}>
        {tab === "dashboard" && <Dashboard dash={dash} />}
        {tab === "sources" && <SourceSummary summary={sourceSummary} />}
        {tab === "partners" && <Partners partners={data.partners} distribution={partnersDistribution} withdrawals={data.withdrawals} boughtNet={sourceSummary.bought.net} onReload={loadAll} showToast={showToast} />}
        {tab === "orders" && (
          <IncomingOrders incoming={incoming} onAccept={acceptIncoming} onReject={rejectIncoming} ordersOpen={ordersOpen} onToggleOrders={toggleOrders} />
        )}
        {Object.keys(TABLES).includes(tab) && (
          <DataTable tableKey={tab} config={TABLES[tab]} rows={computedRows[tab] || []} ordersRows={tab === "sales" ? computedRows.orders : undefined} onReload={loadAll} showToast={showToast} />
        )}
      </main>

      {toast && <div style={{ position: "fixed", bottom: 20, insetInlineStart: "50%", transform: "translateX(50%)", background: COLORS.deep, color: "#F3E9D8", padding: "10px 18px", borderRadius: 10, fontSize: 13 }}>{toast}</div>}
    </div>
  );
}

function waLink(phone, item) {
  const digits = String(phone || "").replace(/[^0-9]/g, "");
  if (!digits) return "";
  // تحويل الرقم المحلي إلى صيغة دولية للإمارات
  const intl = digits.startsWith("00") ? digits.slice(2)
    : digits.startsWith("971") ? digits
    : digits.startsWith("0") ? "971" + digits.slice(1)
    : digits;
  const boxes = num(item.qty);
  const fee = num(item.delivery_fee);
  const total = boxes * DEFAULT_BOX_PRICE + fee;
  const lines = [
    `مرحباً ${item.first_name || item.name || ""} 👋`,
    "",
    "نشكر لكم طلبكم من مزرعتنا، ونفيدكم بأنه تم استلامه بنجاح.",
    "",
    "تفاصيل الطلب:",
    `• الكمية: ${fmt(boxes)} علبة (${fmt(boxes * BOX_SIZE_KG)} كجم)`,
    `• طريقة الاستلام: ${item.fulfillment || "استلام"}`,
  ];
  if (fee > 0) lines.push(`• رسوم التوصيل: ${fmt(fee)} درهم`);
  lines.push(`• الإجمالي: ${fmt(total)} درهم`);
  lines.push("");
  lines.push("نظراً لأن الإنتاج طبيعي ويعتمد على عوامل عدة، سيتم التواصل معكم لتحديد موعد التسليم فور توفر الكمية بإذن الله.");
  lines.push("");
  lines.push("شاكرين لكم حسن تعاملكم 🌴");
  return `https://wa.me/${intl}?text=${encodeURIComponent(lines.join("\n"))}`;
}

          border: `1px solid ${ordersOpen ? COLORS.alert : COLORS.secondary}`,

          color: ordersOpen ? COLORS.alert : "#fff",

        </div>
      )}

      <div style={{ display: "grid", gap: 10 }}>
        {incoming.map((item) => {
          const wa = waLink(item.phone, item);

          const total = num(item.qty) * DEFAULT_BOX_PRICE + fee;

            <div key={item.id} style={{ background: COLORS.surface, borderRadius: 12, border: `1px solid ${COLORS.line}`, borderInlineStart: `4px solid ${COLORS.primary}`, padding: "12px 14px" }}>

                <div style={{ flex: "1 1 200px" }}>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>{item.name}</div>
                  <div style={{ fontSize: 12, color: COLORS.inkSoft, lineHeight: 1.9, marginTop: 3 }}>
                    {fmt(item.qty)} علبة — {item.fulfillment || "استلام"}
                    {fee > 0 ? ` — توصيل ${fmt(fee)} درهم` : ""}
                    <br />
                    <b style={{ color: COLORS.deep }}>الإجمالي: {fmt(total)} درهم</b>
                    {item.phone ? <><br />📞 {item.phone}</> : null}
                    {item.fulfillment === "توصيل" && (
                      <><br />📍 {item.emirate} — {item.area} — منزل {item.house_number}
                      {item.delivery_location ? <><br />🗺️ {item.delivery_location}</> : null}</>
                    )}
                    {item.notes ? <><br />📝 {item.notes}</> : null}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  {wa && (
                    <a href={wa} target="_blank" rel="noopener noreferrer"
                      style={{ ...primaryBtnStyle, background: "#25D366", textDecoration: "none", display: "inline-block" }}>
                      واتساب
                    </a>
                  )}
                  <button onClick={() => onAccept(item)} style={primaryBtnStyle}>قبول</button>
                  <button onClick={() => onReject(item)} style={dangerBtnStyle}>تجاهل</button>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Partners({ partners, distribution, withdrawals, boughtNet, onReload, showToast }) {
  const [wForm, setWForm] = useState({ date: todayISO(), partner_name: "", type: "نقدي", qty: "", amount: "", notes: "" });
  const [showForm, setShowForm] = useState(false);

  const updatePartner = async (p, field, value) => {
    await updateRow("partners", p.id, { [field]: field === "pct" ? num(value) : value });
    onReload();
  };
  const addPartner = async () => { await insertRow("partners", { name: `شريك ${partners.length + 1}`, pct: 0 }); onReload(); };
  const removePartner = async (id) => { await deleteRow("partners", id); onReload(); };

  const submitW = async (e) => {
    e.preventDefault();
    await insertRow("withdrawals", { date: wForm.date, partner_name: wForm.partner_name, type: wForm.type, qty: wForm.type === "علب دبس" ? num(wForm.qty) : null, amount: wForm.type === "نقدي" ? num(wForm.amount) : null, notes: wForm.notes });
    setWForm({ date: todayISO(), partner_name: "", type: "نقدي", qty: "", amount: "", notes: "" });
    setShowForm(false);
    onReload();
    showToast("تم تسجيل السحب");
  };
  const removeW = async (id) => { await deleteRow("withdrawals", id); onReload(); showToast("تم الحذف"); };
  const valueOf = (w) => (w.type === "علب دبس" ? num(w.qty) * DEFAULT_BOX_PRICE : num(w.amount));

  return (
    <div>
      <SectionTitle title="توزيع أرباح إنتاج المزرعة" />
      <div style={{ display: "grid", gap: 10, marginBottom: 16 }}>
        {partners.map((p, i) => {
          const row = distribution.rows[i] || { share: 0, withdrawn: 0, remaining: 0 };
          return (
            <div key={p.id} style={{ background: COLORS.surface, borderRadius: 14, border: `1px solid ${COLORS.line}`, padding: 14 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                <input defaultValue={p.name} onBlur={(e) => updatePartner(p, "name", e.target.value)} style={{ ...inputStyle, flex: "1 1 140px" }} />
                <input type="number" defaultValue={p.pct} onBlur={(e) => updatePartner(p, "pct", e.target.value)} style={{ ...inputStyle, width: 80 }} />
                <span style={{ fontSize: 13 }}>%</span>
                <button onClick={() => removePartner(p.id)} style={dangerBtnStyle}>حذف</button>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 8, marginTop: 10, fontSize: 12.5 }}>
                <div><div style={{ color: COLORS.inkSoft }}>المستحق</div><div style={{ fontWeight: 700, color: COLORS.secondary }}>{fmt(row.share)}</div></div>
                <div><div style={{ color: COLORS.inkSoft }}>المسحوب</div><div style={{ fontWeight: 700, color: COLORS.primary }}>{fmt(row.withdrawn)}</div></div>
                <div><div style={{ color: COLORS.inkSoft }}>المتبقي</div><div style={{ fontWeight: 800, color: row.remaining >= 0 ? COLORS.secondary : COLORS.alert }}>{fmt(row.remaining)}</div></div>
              </div>
            </div>
          );
        })}
        <button onClick={addPartner} style={primaryBtnStyle}>+ إضافة شريك</button>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
        <SectionTitle title="سحوبات الشركاء" />
        <button onClick={() => setShowForm((v) => !v)} style={primaryBtnStyle}>+ تسجيل سحب</button>
      </div>
      {showForm && (
        <form onSubmit={submitW} style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 14, padding: 16, marginBottom: 16 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 10 }}>
            <input type="date" value={wForm.date} onChange={(e) => setWForm((f) => ({ ...f, date: e.target.value }))} style={inputStyle} />
            <select value={wForm.partner_name} onChange={(e) => setWForm((f) => ({ ...f, partner_name: e.target.value }))} style={inputStyle}>
              <option value="">— الشريك —</option>
              {partners.map((p) => <option key={p.id} value={p.name}>{p.name}</option>)}
            </select>
            <select value={wForm.type} onChange={(e) => setWForm((f) => ({ ...f, type: e.target.value }))} style={inputStyle}>
              {WITHDRAWAL_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
            </select>
            {wForm.type === "علب دبس" ? (
              <input type="number" placeholder="الكمية (علبة)" value={wForm.qty} onChange={(e) => setWForm((f) => ({ ...f, qty: e.target.value }))} style={inputStyle} />
            ) : (
              <input type="number" placeholder="المبلغ" value={wForm.amount} onChange={(e) => setWForm((f) => ({ ...f, amount: e.target.value }))} style={inputStyle} />
            )}
            <input placeholder="ملاحظات" value={wForm.notes} onChange={(e) => setWForm((f) => ({ ...f, notes: e.target.value }))} style={inputStyle} />
          </div>
          <button type="submit" style={{ ...primaryBtnStyle, marginTop: 12 }}>تسجيل</button>
        </form>
      )}
      <div style={{ background: COLORS.surface, borderRadius: 14, border: `1px solid ${COLORS.line}`, overflow: "auto" }}>
        <table>
          <thead><tr><th>التاريخ</th><th>الشريك</th><th>النوع</th><th>الكمية/المبلغ</th><th>القيمة</th><th></th></tr></thead>
          <tbody>
            {(withdrawals || []).map((w) => (
              <tr key={w.id}>
                <td>{w.date}</td><td>{w.partner_name}</td><td>{w.type}</td>
                <td>{w.type === "علب دبس" ? `${fmt(w.qty)} علبة` : fmt(w.amount)}</td>
                <td style={{ fontWeight: 700, color: COLORS.primary }}>{fmt(valueOf(w))}</td>
                <td><button onClick={() => removeW(w.id)} style={dangerBtnStyle}>حذف</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div style={{ marginTop: 20 }}>
        <SectionTitle title="أرباح التمور المشتراة" subtitle="تعود بالكامل لناصر" />
        <StatCard label="صافي العائد" value={fmt(boughtNet)} icon="🤝" accent={boughtNet >= 0 ? COLORS.secondary : COLORS.alert} />
      </div>
    </div>
  );
}

function emptyForm(config) {
  const f = {};
  config.columns.forEach((c) => { f[c.key] = c.default !== undefined ? c.default : c.type === "date" ? todayISO() : ""; });
  return f;
}

function DataTable({ tableKey, config, rows, ordersRows, onReload, showToast }) {
  const [form, setForm] = useState(emptyForm(config));
  const [editingId, setEditingId] = useState(null);
  const [showForm, setShowForm] = useState(false);

  useEffect(() => { setForm(emptyForm(config)); setEditingId(null); setShowForm(false); }, [tableKey]);

  const resetForm = () => { setForm(emptyForm(config)); setEditingId(null); setShowForm(false); };
  const startEdit = (row) => {
    const f = emptyForm(config);
    config.columns.forEach((c) => { if (row[c.key] !== undefined && row[c.key] !== null) f[c.key] = row[c.key]; });
    setForm(f); setEditingId(row.id); setShowForm(true);
  };

  const submit = async (e) => {
    e.preventDefault();
    const payload = {};
    config.columns.forEach((c) => {
      let v = form[c.key];
      if (c.type === "number") v = v === "" ? null : num(v);
      if (v === "") v = null;
      payload[c.key] = v;
    });
    try {
      if (editingId != null) { await updateRow(config.table, editingId, payload); showToast("تم حفظ التعديل"); }
      else { await insertRow(config.table, payload); showToast("تمت الإضافة"); }
      resetForm();
      onReload();
    } catch (err) { console.error(err); showToast("حدث خطأ، حاول مرة أخرى"); }
  };
  const remove = async (id) => { await deleteRow(config.table, id); onReload(); showToast("تم الحذف"); };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <SectionTitle title={config.label} subtitle={`${rows.length} سجل`} />
        <button style={primaryBtnStyle} onClick={() => { resetForm(); setShowForm(true); }}>+ إضافة</button>
      </div>

      {showForm && (
        <form onSubmit={submit} style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 14, padding: 16, marginBottom: 16 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", gap: 10 }}>
            {config.columns.map((c) => (
              <label key={c.key} style={{ fontSize: 12, color: COLORS.inkSoft }}>
                {c.label}
                {c.type === "select" ? (
                  <select value={form[c.key] ?? ""} onChange={(e) => setForm((f) => ({ ...f, [c.key]: e.target.value }))} style={{ ...inputStyle, marginTop: 4 }} required={c.required}>
                    <option value="">— اختر —</option>
                    {c.options.map((o) => <option key={o} value={o}>{o}</option>)}
                  </select>
                ) : c.type === "orderLink" ? (
                  <select value={form[c.key] ?? ""} onChange={(e) => {
                    const orderId = e.target.value ? parseInt(e.target.value) : "";
                    const order = (ordersRows || []).find((o) => o.id === orderId);
                    setForm((f) => ({ ...f, [c.key]: orderId, customer: order ? order.customer_name : f.customer }));
                  }} style={{ ...inputStyle, marginTop: 4 }}>
                    <option value="">بدون طلب (بيع مباشر)</option>
                    {(ordersRows || []).map((o) => <option key={o.id} value={o.id}>#{o.id} — {o.customer_name} (متبقٍ {fmt(o.remaining)})</option>)}
                  </select>
                ) : (
                  <input type={c.type === "number" ? "number" : c.type === "date" ? "date" : "text"} value={form[c.key] ?? ""} onChange={(e) => setForm((f) => ({ ...f, [c.key]: e.target.value }))} style={{ ...inputStyle, marginTop: 4 }} required={c.required} />
                )}
              </label>
            ))}
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
            <button type="submit" style={primaryBtnStyle}>{editingId != null ? "حفظ" : "إضافة"}</button>
            <button type="button" onClick={resetForm} style={ghostBtnStyle}>إلغاء</button>
          </div>
        </form>
      )}

      <div style={{ background: COLORS.surface, borderRadius: 14, border: `1px solid ${COLORS.line}`, overflow: "auto" }}>
        {rows.length === 0 ? (
          <div style={{ padding: "30px 16px", textAlign: "center", color: COLORS.inkSoft, fontSize: 13.5 }}>لا توجد سجلات بعد.</div>
        ) : (
          <table>
            <thead><tr>{config.display.map((c) => <th key={c}>{config.columns.find((cc) => cc.key === c)?.label || c}</th>)}<th></th></tr></thead>
            <tbody>
              {rows.map((row) => (
                <tr key={row.id}>
                  {config.display.map((c) => (
                    <td key={c}>{typeof row[c] === "number" ? fmt(row[c], Number.isInteger(row[c]) ? 0 : 2) : (row[c] ?? "")}</td>
                  ))}
                  <td>
                    <button onClick={() => startEdit(row)} style={{ ...dangerBtnStyle, color: COLORS.primary }}>تعديل</button>
                    <button onClick={() => remove(row.id)} style={dangerBtnStyle}>حذف</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ============ الجذر: تسجيل الدخول / رابط العميل / التطبيق ============ */
function Root() {
  const [session, setSession] = useState(undefined);
  const [hash, setHash] = useState(window.location.hash);

  useEffect(() => {
    const onHash = () => setHash(window.location.hash);
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = supabase.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  if (hash === "#story") return <StoryPage />;
  if (hash === "#order") return <CustomerOrderForm />;
  if (session === undefined) return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.bg }}>جارِ التحقق…</div>;
  if (!session) return <LoginScreen />;
  return <MainApp session={session} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
