/* ============ طبقة الاتصال بقاعدة البيانات ============ */
async function fetchTable(table) {
  const { data, error } = await supabase.from(table).select("*").order("id", { ascending: true });
  if (error) { console.error(table, error); return []; }
  return data || [];
}
async function insertRow(table, row) {
  const { data, error } = await supabase.from(table).insert(row).select();
  if (error) throw error;
  return data[0];
}
async function updateRow(table, id, patch) {
  const { error } = await supabase.from(table).update(patch).eq("id", id);
  if (error) throw error;
}
async function deleteRow(table, id) {
  const { error } = await supabase.from(table).delete().eq("id", id);
  if (error) throw error;
}
async function getSetting(key, fallback) {
  const { data } = await supabase.from("settings").select("value").eq("key", key).maybeSingle();
  return data ? data.value : fallback;
}
async function setSetting(key, value) {
  await supabase.from("settings").upsert({ key, value });
}

/* ============ حسابات لوحة التحكم ============ */
function computeSourceSummary(rows) {
  const bags = rows.bags || [], boxes = rows.boxes || [], sales = rows.sales || [], nafia = rows.nafia || [], costs = rows.costs || [], purchases = rows.purchases || [];
  const purchasedBoxes = purchases.filter((r) => r.method === "بالصندوق").reduce((s, r) => s + num(r.qty), 0);
  const purchasedPalms = purchases.filter((r) => r.method === "بالنخلة").reduce((s, r) => s + num(r.qty), 0);
  const bySource = (source) => {
    const bagsCount = bags.filter((r) => r.source === source).reduce((s, r) => s + num(r.bag_count), 0);
    const boxesCount = boxes.filter((r) => r.source === source).reduce((s, r) => s + num(r.box_count), 0);
    const salesRev = sales.filter((r) => r.source === source).reduce((s, r) => s + num(r.qty) * num(r.unit_price), 0);
    const nafiaRev = nafia.filter((r) => r.source === source).reduce((s, r) => s + num(r.qty_sacks) * num(r.unit_price), 0);
    const cost = costs.filter((r) => r.source === source).reduce((s, r) => s + num(r.amount), 0);
    return { bagsCount, boxes: boxesCount, purchasedBoxes: source === "تمور مشتراة" ? purchasedBoxes : 0, purchasedPalms: source === "تمور مشتراة" ? purchasedPalms : 0, salesRev, nafiaRev, cost, net: salesRev + nafiaRev - cost };
  };
  return { farm: bySource("إنتاج المزرعة"), bought: bySource("تمور مشتراة") };
}
function computeDash(rows) {
  const bags = rows.bags || [], boxes = rows.boxes || [], sales = rows.sales || [], nafia = rows.nafia || [], gifts = rows.gifts || [], costs = rows.costs || [];
  const bagsFarm = bags.filter((r) => r.source === "إنتاج المزرعة").reduce((s, r) => s + num(r.bag_count), 0);
  const bagsBought = bags.filter((r) => r.source === "تمور مشتراة").reduce((s, r) => s + num(r.bag_count), 0);
  const boxesFarm = boxes.filter((r) => r.source === "إنتاج المزرعة").reduce((s, r) => s + num(r.box_count), 0);
  const boxesBought = boxes.filter((r) => r.source === "تمور مشتراة").reduce((s, r) => s + num(r.box_count), 0);
  const totalDibs = boxes.reduce((s, r) => s + (r.box_count && r.box_weight ? num(r.box_count) * num(r.box_weight) : 0), 0);
  const nafiaSacks = nafia.reduce((s, r) => s + num(r.qty_sacks), 0);
  const salesRevenue = sales.reduce((s, r) => s + num(r.qty) * num(r.unit_price), 0);
  const nafiaRevenue = nafia.reduce((s, r) => s + num(r.qty_sacks) * num(r.unit_price), 0);
  const totalRevenue = salesRevenue + nafiaRevenue;
  const totalCosts = costs.reduce((s, r) => s + num(r.amount), 0);
  const totalBags = bagsFarm + bagsBought, totalBoxes = boxesFarm + boxesBought;

  /* ===== حركة العلب ===== */
  const orders = rows.orders || [];
  const ordered = orders.reduce((s, r) => s + num(r.qty_requested), 0);   // إجمالي المطلوب
  const delivered = sales.reduce((s, r) => s + num(r.qty), 0);            // المسلّم فعلاً
  const gifted = gifts.reduce((s, r) => s + num(r.qty), 0);               // العطايا
  const pending = orders.reduce((s, r) => s + Math.max(0, num(r.qty_requested) - num(r.delivered)), 0); // المتبقي للعملاء
  const available = totalBoxes - delivered - gifted;                      // المتوفر بالمخزن

  return {
    bagsFarm, bagsBought, boxesFarm, boxesBought, totalDibs, nafiaSacks, salesRevenue, nafiaRevenue,
    totalRevenue, totalCosts, netProfit: totalRevenue - totalCosts,
    avgBoxesPerBag: totalBags > 0 ? totalBoxes / totalBags : 0,
    totalGiftBoxes: gifted,
    totalBoxes, ordered, delivered, pending, available,
  };
}

/* ============ تسجيل الدخول ============ */
function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setLoading(true); setError("");
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    setLoading(false);
    if (error) setError("بيانات الدخول غير صحيحة");
  };

  return (
    <div dir="rtl" style={{ minHeight: "100vh", background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ maxWidth: 380, width: "100%", background: COLORS.surface, borderRadius: 18, padding: 28, border: `1px solid ${COLORS.line}` }}>
        <div style={{ marginBottom: 20 }}>
          <LogoLockup size={54} />
        </div>
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 20 }}>تسجيل دخول صاحب النظام</div>
        <form onSubmit={submit}>
          <div style={{ display: "grid", gap: 12 }}>
            <input type="email" required placeholder="البريد الإلكتروني" value={email} onChange={(e) => setEmail(e.target.value)} style={inputStyle} />
            <input type="password" required placeholder="كلمة المرور" value={password} onChange={(e) => setPassword(e.target.value)} style={inputStyle} />
          </div>
          {error && <div style={{ color: COLORS.alert, fontSize: 12.5, marginTop: 10 }}>{error}</div>}
          <button type="submit" disabled={loading} style={{ ...primaryBtnStyle, width: "100%", marginTop: 16, padding: "11px 16px" }}>
            {loading ? "جارٍ الدخول…" : "دخول"}
          </button>
        </form>
      </div>
    </div>
  );
}

    if (!navigator.geolocation) { setGeo("error"); return; }
    setGeo("loading");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        setCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        setGeo("done");

      () => setGeo("error"),
      { enableHighAccuracy: true, timeout: 12000 }

/* ============ صفحة إلغاء الطلب (للعميل عبر رابط خاص) ============ */

function CancelOrderPage({ token }) {
  const [order, setOrder] = useState(undefined);
  const [reason, setReason] = useState("");
  const [status, setStatus] = useState("idle"); // idle | saving | done | error
  const [errMsg, setErrMsg] = useState("");

  useEffect(() => {
    (async () => {
      if (!token) { setOrder(null); return; }
      const { data, error } = await supabase.rpc("get_order_by_token", { p_token: token });
      if (error) { console.error(error); setOrder(null); return; }
      if (!data || !data.length) { setOrder(null); return; }
      setOrder(data[0]);
    })();
  }, [token]);

  const confirmCancel = async () => {
    setStatus("saving");
    const { data, error } = await supabase.rpc("cancel_order_by_token", { p_token: token, p_reason: reason || null });
    if (error) { setErrMsg(error.message || "تعذّر إلغاء الطلب"); setStatus("error"); return; }
    if (data === "not_found") { setOrder(null); return; }
    setOrder((o) => ({ ...o, status: data === "cancelled" ? "cancelled" : data }));
    setStatus(data === "cancelled" ? "done" : "idle");
  };

  const wrap = { minHeight: "100vh", background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 };
  const card = { maxWidth: 420, width: "100%", background: COLORS.surface, borderRadius: 18, padding: 24, border: `1px solid ${COLORS.line}` };

    return <div dir="rtl" style={wrap}><div style={{ color: COLORS.inkSoft }}>جارٍ التحميل…</div></div>;
  }

  if (order === null) {
    return (
      <div dir="rtl" style={wrap}>
        <div style={{ ...card, textAlign: "center" }}>
          <div style={{ fontSize: 34, marginBottom: 10 }}>🔍</div>
          <div style={{ fontFamily: "Cairo, sans-serif", fontWeight: 800, fontSize: 17, color: COLORS.deep }}>الرابط غير صالح</div>

          </div>
          <a href="#order" style={{ ...ghostBtnStyle, display: "inline-block", textDecoration: "none", marginTop: 18 }}>
            صفحة الطلب
          </a>
        </div>
      </div>
    );
  }

  const alreadyCancelled = order.status === "cancelled";
  const alreadyAccepted = order.status === "accepted";
  const boxes = num(order.qty);
  const fee = num(order.delivery_fee);
  const total = boxes * DEFAULT_BOX_PRICE + fee;

  return (
    <div dir="rtl" style={wrap}>

              {fee > 0 && <div><b>رسوم التوصيل:</b> {fmt(fee)} درهم</div>}

            <label style={{ fontSize: 12.5, color: COLORS.inkSoft }}>

                placeholder="يساعدنا على التحسين" style={{ ...inputStyle, marginTop: 4 }} />

            {status === "error" && (
              <div style={{ color: COLORS.alert, fontSize: 12.5, marginTop: 10 }}>{errMsg}</div>

            <button onClick={confirmCancel} disabled={status === "saving"}
              style={{
                width: "100%", marginTop: 16, padding: "12px 16px", borderRadius: 10,

      </div>
    </div>
  );
}

/* ============ التحصيل والذمم ============ */

function CollectionsPanel({ sales, onReload, showToast }) {
  const [busy, setBusy] = useState(null);
  const [method, setMethod] = useState({});

  const uncollected = useMemo(
    () => (sales || []).filter((s) => !s.collected && num(s.qty) > 0),
    [sales]
  );
  const collected = useMemo(
    () => (sales || []).filter((s) => s.collected),
    [sales]
  );

  const totalOf = (list) => list.reduce((s, r) => s + num(r.qty) * num(r.unit_price), 0);
  const due = totalOf(uncollected);
  const got = totalOf(collected);
  const cash = totalOf(collected.filter((s) => s.payment_method === "كاش"));
  const bank = totalOf(collected.filter((s) => s.payment_method === "تحويل بنكي"));

  const collect = async (s) => {
    const m = method[s.id] || "كاش";
    const total = num(s.qty) * num(s.unit_price);
    if (!window.confirm(`تأكيد تحصيل ${fmt(total)} درهم من ${s.customer || "العميل"} (${m})؟`)) return;
    setBusy(s.id);
    try {
      await updateRow("sales", s.id, { collected: true, collected_at: todayISO(), payment_method: m });
      await onReload();
      showToast("تم تسجيل التحصيل ✅");
    } catch (err) {
      console.error(err);
      showToast("تعذّر تسجيل التحصيل");
    }
    setBusy(null);
  };

  return (
    <div style={{ marginBottom: 20 }}>
      <SectionTitle title="التحصيل" subtitle={uncollected.length ? `${uncollected.length} عملية غير محصّلة` : "لا توجد ذمم"} />

      {/* إحصائية */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12, marginBottom: 16 }}>
        <StatCard label="محصّل" value={fmt(got)} icon="✅" accent={COLORS.secondary} />
        <StatCard label="ذمم (غير محصّل)" value={fmt(due)} icon="⏳" accent={due > 0 ? COLORS.alert : COLORS.inkSoft} />
        <StatCard label="كاش" value={fmt(cash)} icon="💵" />
        <StatCard label="تحويل بنكي" value={fmt(bank)} icon="🏦" />
      </div>

      {uncollected.length > 0 && (
        <div style={{ display: "grid", gap: 9 }}>
          {uncollected.map((s) => {
            const total = num(s.qty) * num(s.unit_price);
            return (
              <div key={s.id} style={{
                background: COLORS.surface, borderRadius: 12, padding: "11px 13px",
                border: `1px solid ${COLORS.line}`, borderInlineStart: `4px solid ${COLORS.alert}`,
                display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 9,
              }}>
                <div style={{ flex: "1 1 160px" }}>
                  <div style={{ fontWeight: 700, fontSize: 13.5 }}>{s.customer || "—"}</div>
                  <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 2 }}>
                    {fmt(s.qty)} علبة × {fmt(s.unit_price)} · <b style={{ color: COLORS.alert }}>{fmt(total)} درهم</b>
                    {s.date ? ` · ${s.date}` : ""}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                  <select value={method[s.id] || "كاش"}
                    onChange={(e) => setMethod((p) => ({ ...p, [s.id]: e.target.value }))}
                    style={{ ...inputStyle, width: 112 }}>
                    {COLLECT_OPTIONS.map((m) => <option key={m} value={m}>{m}</option>)}
                  </select>
                  <button disabled={busy === s.id} onClick={() => collect(s)}
                    style={{ ...primaryBtnStyle, background: COLORS.secondary, opacity: busy === s.id ? 0.6 : 1 }}>
                    {busy === s.id ? "…" : "💰 تحصيل"}
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ============ تسليم الطلبات ============ */

/* بطاقة تفاصيل الطلب — تعديل، تسليم، تراجع، إعادة */
function OrderDetail({ order, sales, onClose, onReload, showToast, boxPrice }) {
  const [busy, setBusy] = useState("");
  const [edit, setEdit] = useState({
    customer_name: order.customer_name || "",
    qty_requested: order.qty_requested ?? "",
    order_date: order.order_date || "",
    notes: order.notes || "",
  });
  const [qty, setQty] = useState("");
  const [price, setPrice] = useState(boxPrice);
  const [pay, setPay] = useState("كاش");
  const [editLine, setEditLine] = useState(null);   // id السطر تحت التعديل
  const [lineDraft, setLineDraft] = useState({ qty: "", unit_price: "" });

  const lines = useMemo(
    () => (sales || []).filter((s) => s.order_id === order.id).sort((a, b) => (b.id || 0) - (a.id || 0)),
    [sales, order.id]
  );
  const delivered = lines.reduce((s, r) => s + num(r.qty), 0);
  const req = num(order.qty_requested);
  const rem = Math.max(0, req - delivered);
  const pct = req > 0 ? Math.round((delivered / req) * 100) : 0;
  const totalValue = lines.reduce((s, r) => s + num(r.qty) * num(r.unit_price), 0);
  const collectedValue = lines.filter((r) => r.collected).reduce((s, r) => s + num(r.qty) * num(r.unit_price), 0);
  const dueValue = totalValue - collectedValue;

  const run = async (key, fn, okMsg) => {
    setBusy(key);
    try { await fn(); await onReload(); if (okMsg) showToast(okMsg); }
    catch (err) { console.error(err); showToast("تعذّر تنفيذ العملية"); }
    setBusy("");
  };

  /* حفظ تعديل بيانات الطلب */
  const saveOrder = () => run("order", async () => {
    await updateRow("orders", order.id, {
      customer_name: edit.customer_name,
      qty_requested: edit.qty_requested === "" ? null : num(edit.qty_requested),
      order_date: edit.order_date || null,
      notes: edit.notes || null,
    });
  }, "تم حفظ التعديل");

  /* تسجيل تسليم جديد */
  const deliver = (collected) => {
    const q = num(qty || rem);
    const up = num(price);
    if (q <= 0) { showToast("أدخل كمية صحيحة"); return; }
    if (q > rem) { showToast("الكمية أكبر من المتبقي"); return; }
    if (up <= 0) { showToast("أدخل سعراً صحيحاً"); return; }
    run("deliver", async () => {
      await insertRow("sales", {
        date: todayISO(), order_id: order.id, customer: order.customer_name,
        qty: q, unit_price: up,
        payment_method: collected ? pay : null,
        collected: !!collected,
        collected_at: collected ? todayISO() : null,
        notes: "تسليم من قائمة الطلبات",
      });
      setQty("");
    }, q < rem
      ? `تسليم جزئي ${fmt(q)} علبة — بقي ${fmt(rem - q)} بانتظار التسليم`
      : (collected ? "تم تسليم الطلب كاملاً ✅" : "تم تسليم الطلب كاملاً (آجل)"));
  };

  /* تراجع عن عملية تسليم */
  const undoLine = (s) => {
    if (!window.confirm(`تراجع عن تسليم ${fmt(s.qty)} علبة؟\nسترجع الكمية إلى «بانتظار التسليم».`)) return;
    run("l" + s.id, async () => { await deleteRow("sales", s.id); }, "تم التراجع — رجعت الكمية للانتظار");
  };

  /* تبديل حالة التحصيل */
  const toggleCollected = (s) => run("c" + s.id, async () => {
    await updateRow("sales", s.id, s.collected
      ? { collected: false, collected_at: null, payment_method: null }
      : { collected: true, collected_at: todayISO(), payment_method: s.payment_method || "كاش" });
  }, s.collected ? "رجع المبلغ إلى الذمم" : "تم تسجيل التحصيل ✅");

  /* حفظ تعديل سطر تسليم */
  const saveLine = (s) => run("e" + s.id, async () => {
    const q = num(lineDraft.qty), up = num(lineDraft.unit_price);
    if (q <= 0 || up <= 0) throw new Error("قيم غير صحيحة");
    await updateRow("sales", s.id, { qty: q, unit_price: up });
    setEditLine(null);
  }, "تم حفظ التعديل");

  const overlay = {
    position: "fixed", inset: 0, background: "rgba(43,27,18,.55)", zIndex: 50,
    display: "flex", alignItems: "flex-start", justifyContent: "center",
    padding: "20px 12px", overflowY: "auto",
  };
  const sheet = {
    background: COLORS.surface, borderRadius: 16, border: `1px solid ${COLORS.line}`,
    width: "100%", maxWidth: 560, padding: 18, marginTop: 10,
  };
  const lbl = { fontSize: 11.5, color: COLORS.inkSoft, fontWeight: 600 };

  return (
    <div style={overlay} onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={sheet} dir="rtl">
        {/* الرأس */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, marginBottom: 14 }}>
          <div>
            <div style={{ fontFamily: "Cairo, sans-serif", fontWeight: 800, fontSize: 17, color: COLORS.deep }}>
              {order.customer_name}
            </div>
            <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 3 }}>
              طلب #{order.id}{order.order_date ? ` · ${order.order_date}` : ""}
            </div>
            <span style={{
              display: "inline-block", marginTop: 7, borderRadius: 20, padding: "3px 12px",
              fontSize: 11, fontWeight: 800,
              background: rem === 0 ? "rgba(107,122,58,.15)" : delivered > 0 ? "rgba(181,101,29,.15)" : COLORS.amberLight,
              color: rem === 0 ? COLORS.secondary : delivered > 0 ? COLORS.primary : COLORS.inkSoft,
            }}>
              {rem === 0 ? "مكتمل" : delivered > 0 ? `جزئي — بانتظار ${fmt(rem)}` : "بانتظار التسليم"}
            </span>
          </div>
          <button onClick={onClose} style={{ ...ghostBtnStyle, padding: "6px 12px", fontSize: 13 }}>✕</button>
        </div>

        {/* الملخص */}
        <div style={{ background: COLORS.bg, borderRadius: 12, padding: "12px 14px", marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 8, flexWrap: "wrap", gap: 6 }}>
            <span>مطلوب <b>{fmt(req)}</b></span>
            <span style={{ color: COLORS.secondary }}>سُلّم <b>{fmt(delivered)}</b></span>
            <span style={{ color: rem > 0 ? COLORS.alert : COLORS.secondary }}>متبقٍ <b>{fmt(rem)}</b></span>
          </div>
          <div style={{ height: 6, background: COLORS.line, borderRadius: 3, overflow: "hidden" }}>
            <div style={{ width: `${pct}%`, height: "100%", background: rem === 0 ? COLORS.secondary : COLORS.primary }} />
          </div>
          {totalValue > 0 && (
            <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 9, lineHeight: 1.9 }}>
              قيمة المُسلّم: <b style={{ color: COLORS.deep }}>{fmt(totalValue)} درهم</b>
              {dueValue > 0 && <span style={{ color: COLORS.alert }}> · بالذمم {fmt(dueValue)}</span>}

        </div>

        {/* تسليم جديد */}

          <div style={{ border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 13, marginBottom: 16 }}>

            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
              <label style={{ ...lbl, flex: "1 1 80px" }}>الكمية

              </label>
              <label style={{ ...lbl, flex: "1 1 90px" }}>سعر العلبة
                <input type="number" min="0" value={price}
                  onChange={(e) => setPrice(e.target.value)} style={{ ...inputStyle, marginTop: 4, textAlign: "center" }} />
              </label>
              <label style={{ ...lbl, flex: "1 1 100px" }}>التحصيل
                <select value={pay} onChange={(e) => setPay(e.target.value)} style={{ ...inputStyle, marginTop: 4 }}>
                  {COLLECT_OPTIONS.map((m) => <option key={m} value={m}>{m}</option>)}
                </select>
              </label>
            </div>
            <div style={{ fontSize: 12, color: COLORS.deep, fontWeight: 700, margin: "10px 0" }}>

            </div>
            <div style={{ display: "flex", gap: 8 }}>

        ) : (
          <div style={{ display: "grid", gap: 8, marginBottom: 16 }}>
            {lines.map((s) => {
              const editing = editLine === s.id;
              return (

                  background: COLORS.bg, borderRadius: 10, padding: "10px 12px",
                  border: `1px solid ${COLORS.line}`,
                  borderInlineStart: `4px solid ${s.collected ? COLORS.secondary : COLORS.alert}`,

                    <div style={{ display: "flex", gap: 7, flexWrap: "wrap", alignItems: "center" }}>

                      <span style={{ fontSize: 11, color: COLORS.inkSoft }}>×</span>
                      <input type="number" min="0" value={lineDraft.unit_price}

function DeliveryPanel({ orders, sales, onReload, showToast, boxPrice }) {
  const [openId, setOpenId] = useState(null);
  const [showDone, setShowDone] = useState(false);

  const openOrders = useMemo(() => (orders || []).filter((o) => num(o.remaining) > 0), [orders]);
  const doneOrders = useMemo(
    () => (orders || []).filter((o) => num(o.remaining) === 0 && num(o.delivered) > 0),
    [orders]
  );
  const selected = (orders || []).find((o) => o.id === openId) || null;

  const Card = ({ o, done }) => {
    const req = num(o.qty_requested), del = num(o.delivered), rem = num(o.remaining);

    return (
      <div onClick={() => setOpenId(o.id)} style={{
        background: COLORS.bg, borderRadius: 12, padding: "12px 14px", cursor: "pointer",
        border: `1px solid ${COLORS.line}`,
        borderInlineStart: `4px solid ${done ? COLORS.secondary : del > 0 ? COLORS.primary : COLORS.line}`,
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 14 }}>
              {o.customer_name}
              {String(o.notes || "").includes("عبر الرابط الإلكتروني") && (
                <span style={{
                  marginInlineStart: 6, fontSize: 10.5, fontWeight: 700,
                  background: "rgba(76,107,47,.15)", color: COLORS.secondary,
                  borderRadius: 20, padding: "2px 8px",
                }}>🌐 إلكتروني</span>
              )}
              {!done && del > 0 && (
                <span style={{
                  marginInlineStart: 8, fontSize: 10.5, fontWeight: 800,
                  background: "rgba(181,101,29,.15)", color: COLORS.primary,
                  borderRadius: 20, padding: "2px 9px",
                }}>جزئي</span>
              )}

            <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 3 }}>
              {done
                ? <>سُلّم كاملاً · {fmt(del)} علبة</>
                : <>مطلوب {fmt(req)} · <b style={{ color: COLORS.alert }}>متبقٍ {fmt(rem)}</b></>}
              {o.order_date ? ` · ${o.order_date}` : ""}
            </div>
            {!done && del > 0 && (
              <div style={{ height: 4, background: COLORS.line, borderRadius: 2, marginTop: 7, overflow: "hidden" }}>
                <div style={{ width: `${pct}%`, height: "100%", background: COLORS.secondary }} />
              </div>
            )}

          <span style={{ color: COLORS.inkSoft, fontSize: 16 }}>‹</span>

  return (
    <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 14, padding: 14, marginBottom: 18 }}>
      <SectionTitle title="التسليم"
        subtitle={openOrders.length ? `${openOrders.length} طلب بانتظار التسليم — اضغط على العميل للتفاصيل` : "لا توجد طلبات بانتظار التسليم"} />

      {openOrders.length > 0 ? (
        <div style={{ display: "grid", gap: 9 }}>
          {openOrders.map((o) => <Card key={o.id} o={o} />)}
        </div>
      ) : (
        <div style={{ padding: "18px 12px", textAlign: "center", color: COLORS.inkSoft, fontSize: 13.5 }}>
          ✅ كل الطلبات مُسلّمة.
        </div>
      )}

      {doneOrders.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <button onClick={() => setShowDone((v) => !v)} style={{ ...ghostBtnStyle, padding: "7px 13px", fontSize: 12 }}>
            {showDone ? "إخفاء" : `الطلبات المكتملة (${doneOrders.length})`}
          </button>
          {showDone && (
            <div style={{ display: "grid", gap: 9, marginTop: 10 }}>
              {doneOrders.map((o) => <Card key={o.id} o={o} done />)}
            </div>
          )}
        </div>
      )}

      {selected && (
        <OrderDetail order={selected} sales={sales} boxPrice={boxPrice}
          onClose={() => setOpenId(null)} onReload={onReload} showToast={showToast} />
      )}
    </div>
  );
}

/* ============ توزيع الكمية المتوفرة على الطلبات ============ */

function AllocationPanel({ orders, available, showToast }) {
  const [open, setOpen] = useState(false);
  const [picked, setPicked] = useState({});   // { orderId: qty }
  const [strategy, setStrategy] = useState("fifo");

  /* الطلبات التي لم تكتمل بعد */
  const pendingOrders = useMemo(
    () => (orders || []).filter((o) => num(o.remaining) > 0),
    [orders]
  );
  const totalPending = pendingOrders.reduce((s, o) => s + num(o.remaining), 0);
  const allocated = Object.values(picked).reduce((s, v) => s + num(v), 0);
  const left = available - allocated;

  /* التوزيع التلقائي */
  const autoAllocate = (mode) => {
    setStrategy(mode);
    let pool = available;
    const next = {};

    if (mode === "fifo") {
      // الأقدم أولاً — يُخدم كاملاً ثم التالي
      [...pendingOrders]
        .sort((a, b) => String(a.order_date || "").localeCompare(String(b.order_date || "")))
        .forEach((o) => {
          const take = Math.min(num(o.remaining), pool);
          if (take > 0) { next[o.id] = take; pool -= take; }
        });
    } else if (mode === "small") {
      // الطلبات الصغيرة أولاً — يُرضي أكبر عدد من العملاء
      [...pendingOrders]
        .sort((a, b) => num(a.remaining) - num(b.remaining))
        .forEach((o) => {
          const take = Math.min(num(o.remaining), pool);
          if (take > 0) { next[o.id] = take; pool -= take; }
        });
    } else {
      // بالتناسب — كل عميل يأخذ نسبة من طلبه
      const ratio = totalPending > 0 ? available / totalPending : 0;
      pendingOrders.forEach((o) => {
        const take = Math.floor(num(o.remaining) * ratio);
        if (take > 0) next[o.id] = take;
      });
    }
    setPicked(next);
  };

  const setQty = (id, v, max) => {
    const q = Math.max(0, Math.min(num(v), max));
    setPicked((p) => ({ ...p, [id]: q }));
  };

  if (!pendingOrders.length) return null;

  const shortage = available < totalPending;

  return (
    <div style={{
      background: COLORS.surface, borderRadius: 14,
      border: `1px solid ${shortage ? COLORS.alert : COLORS.line}`,
      padding: 14, marginBottom: 18,
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <div>
          <div style={{ fontFamily: "Cairo, sans-serif", fontWeight: 800, fontSize: 15, color: COLORS.deep }}>
            توزيع الكمية المتوفرة
          </div>
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 3, lineHeight: 1.8 }}>
            المتوفر <b style={{ color: shortage ? COLORS.alert : COLORS.secondary }}>{fmt(available)}</b> علبة ·
            المطلوب <b>{fmt(totalPending)}</b> علبة
            {shortage && <span style={{ color: COLORS.alert }}> · نقص {fmt(totalPending - available)}</span>}
          </div>
        </div>
        <button onClick={() => setOpen((v) => !v)} style={ghostBtnStyle}>
          {open ? "إخفاء" : "🎯 وزّع الكمية"}
        </button>
      </div>

      {open && (
        <div style={{ marginTop: 14 }}>
          <div style={{ display: "flex", gap: 7, flexWrap: "wrap", marginBottom: 12 }}>
            {[
              { k: "fifo", l: "الأقدم أولاً" },
              { k: "small", l: "الأصغر أولاً" },
              { k: "pro", l: "بالتناسب" },
            ].map((s) => (
              <button key={s.k} onClick={() => autoAllocate(s.k)} style={{
                ...ghostBtnStyle, padding: "7px 13px", fontSize: 12,
                background: strategy === s.k && allocated > 0 ? COLORS.primary : "#fff",
                color: strategy === s.k && allocated > 0 ? "#fff" : COLORS.inkSoft,
                borderColor: strategy === s.k && allocated > 0 ? COLORS.primary : COLORS.line,
              }}>{s.l}</button>
            ))}
            {allocated > 0 && (
              <button onClick={() => setPicked({})} style={{ ...ghostBtnStyle, padding: "7px 13px", fontSize: 12, color: COLORS.alert, borderColor: COLORS.alert }}>
                ✕ مسح
              </button>
            )}
          </div>

          <div style={{ display: "grid", gap: 8 }}>
            {pendingOrders.map((o) => {
              const max = num(o.remaining);
              const q = num(picked[o.id]);
              const partial = q > 0 && q < max;
              return (
                <div key={o.id} style={{
                  display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap",
                  background: q > 0 ? "rgba(107,122,58,.08)" : COLORS.bg,
                  borderRadius: 10, padding: "9px 12px",
                  border: `1px solid ${q > 0 ? COLORS.secondary : COLORS.line}`,
                }}>
                  <div style={{ flex: "1 1 140px", fontSize: 13 }}>
                    <b>{o.customer_name}</b>
                    <span style={{ color: COLORS.inkSoft, fontSize: 11.5 }}> · طلب {fmt(o.qty_requested)} · متبقٍ {fmt(max)}</span>
                    {o.order_date && <span style={{ color: COLORS.inkSoft, fontSize: 11 }}> · {o.order_date}</span>}
                  </div>
                  <input type="number" min="0" max={max} value={picked[o.id] ?? ""}
                    onChange={(e) => setQty(o.id, e.target.value, max)}
                    placeholder="0"
                    style={{ ...inputStyle, width: 80, textAlign: "center" }} />
                  <button onClick={() => setQty(o.id, max, max)} style={{ ...ghostBtnStyle, padding: "6px 10px", fontSize: 11.5 }}>
                    كامل
                  </button>
                  {partial && (
                    <span style={{ fontSize: 11, color: COLORS.primary, fontWeight: 700 }}>جزئي</span>
                  )}
                </div>
              );
            })}
          </div>

          <div style={{
            display: "flex", justifyContent: "space-between", alignItems: "center",
            marginTop: 14, paddingTop: 12, borderTop: `1px solid ${COLORS.line}`,
            flexWrap: "wrap", gap: 10, fontSize: 13,
          }}>
            <div>
              الموزّع: <b style={{ color: COLORS.primary }}>{fmt(allocated)}</b> علبة ·
              المتبقي من المخزون: <b style={{ color: left < 0 ? COLORS.alert : COLORS.secondary }}>{fmt(left)}</b>
            </div>
            <button
              onClick={() => {
                const lines = pendingOrders
                  .filter((o) => num(picked[o.id]) > 0)
                  .map((o) => `• ${o.customer_name}: ${fmt(picked[o.id])} علبة${num(picked[o.id]) < num(o.remaining) ? " (جزئي)" : ""}`);
                if (!lines.length) { showToast("لم تُوزّع أي كمية بعد"); return; }
                navigator.clipboard?.writeText(["خطة التسليم:", ...lines, "", `الإجمالي: ${fmt(allocated)} علبة`].join("\\n"));
                showToast("تم نسخ خطة التسليم");
              }}
              style={primaryBtnStyle}>
              📋 نسخ خطة التسليم
            </button>
          </div>

          {left < 0 && (
            <div style={{ color: COLORS.alert, fontSize: 12, marginTop: 10, fontWeight: 700 }}>
              ⚠️ وزّعت أكثر من المتوفر بـ {fmt(Math.abs(left))} علبة.
            </div>
          )}

          <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 12, lineHeight: 1.9 }}>
            هذه أداة تخطيط فقط — لا تُسجّل مبيعات. بعد الاتفاق مع العميل، سجّل التسليم في تبويب «المبيعات».
          </div>
        </div>
      )}
    </div>
  );
}

/* ============ شريط الأدوات: الفلترة والتصدير ============ */

function ToolsBar({ range, setRange, onExportBackup, onExportCSV, boxPrice, onChangePrice }) {
  const preset = (days) => {
    const to = new Date();
    const from = new Date();
    from.setDate(to.getDate() - days);
    setRange({ from: from.toISOString().slice(0, 10), to: to.toISOString().slice(0, 10) });
  };
  const active = range.from || range.to;

  return (
    <div style={{
      background: COLORS.surface, border: `1px solid ${COLORS.line}`,
      borderRadius: 14, padding: 14, marginBottom: 18,
    }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "flex-end" }}>
        <label style={{ fontSize: 12, color: COLORS.inkSoft, flex: "1 1 130px" }}>
          من تاريخ
          <input type="date" value={range.from}
            onChange={(e) => setRange((r) => ({ ...r, from: e.target.value }))}
            style={{ ...inputStyle, marginTop: 4 }} />
        </label>
        <label style={{ fontSize: 12, color: COLORS.inkSoft, flex: "1 1 130px" }}>
          إلى تاريخ
          <input type="date" value={range.to}
            onChange={(e) => setRange((r) => ({ ...r, to: e.target.value }))}
            style={{ ...inputStyle, marginTop: 4 }} />
        </label>
      </div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginTop: 12 }}>
        {[{ l: "آخر ٣٠ يوم", d: 30 }, { l: "آخر ٣ شهور", d: 90 }, { l: "آخر سنة", d: 365 }].map((b) => (
          <button key={b.d} onClick={() => preset(b.d)} style={{ ...ghostBtnStyle, padding: "7px 12px", fontSize: 12 }}>
            {b.l}
          </button>
        ))}
        {active && (
          <button onClick={() => setRange({ from: "", to: "" })}
            style={{ ...ghostBtnStyle, padding: "7px 12px", fontSize: 12, color: COLORS.alert, borderColor: COLORS.alert }}>
            ✕ إلغاء الفلترة
          </button>
        )}
        <div style={{ flex: 1 }} />
        <button onClick={onExportCSV} style={{ ...ghostBtnStyle, padding: "7px 12px", fontSize: 12 }}>
          📊 تصدير تقرير
        </button>
        <button onClick={onChangePrice} style={{ ...ghostBtnStyle, padding: "7px 12px", fontSize: 12 }}>
          🏷️ سعر العلبة: {fmt(boxPrice)}
        </button>
        <button onClick={onExportBackup} style={{ ...primaryBtnStyle, padding: "7px 12px", fontSize: 12 }}>
          💾 نسخة احتياطية
        </button>
      </div>

      {active && (
        <div style={{ fontSize: 11.5, color: COLORS.primary, marginTop: 10, fontWeight: 600 }}>
          الأرقام المعروضة للفترة: {range.from || "البداية"} ← {range.to || "اليوم"}
        </div>
      )}
    </div>
  );
}

/* ============ التطبيق الرئيسي (بعد تسجيل الدخول) ============ */
function MainApp({ session }) {
  const [tab, setTab] = useState("dashboard");
  const [data, setData] = useState({ bags: [], boxes: [], purchases: [], orders: [], sales: [], nafia: [], gifts: [], costs: [], withdrawals: [], partners: [] });
  const [incoming, setIncoming] = useState([]);
  const [cancelled, setCancelled] = useState([]);
  const [ordersOpen, setOrdersOpen] = useState(true);
  const [boxPrice, setBoxPrice] = useState(DEFAULT_BOX_PRICE);
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState(null);
  const showToast = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); }, []);

  const loadAll = useCallback(async () => {
    const keys = Object.keys(TABLES);
    const results = await Promise.all(keys.map((k) => fetchTable(TABLES[k].table)));
    const next = {};
    keys.forEach((k, i) => (next[k] = results[i]));
    next.withdrawals = await fetchTable("withdrawals");
    next.partners = await fetchTable("partners");
    if (next.partners.length === 0) {
      const defaults = [{ name: "حسن", pct: 33.333 }, { name: "أحمد", pct: 33.333 }, { name: "عزيز وناصر", pct: 33.334 }];
      for (const p of defaults) await insertRow("partners", p);
      next.partners = await fetchTable("partners");
    }
    setData(next);
    const { data: inc } = await supabase.from("incoming_orders").select("*").eq("status", "pending").order("submitted_at", { ascending: true });
    setIncoming(inc || []);
    const { data: canc } = await supabase.from("incoming_orders").select("*").eq("status", "cancelled").order("submitted_at", { ascending: false });
    setCancelled(canc || []);
    const openVal = await getSetting("orders_open", true);
    setOrdersOpen(openVal !== false && openVal !== "false");
    const priceVal = num(await getSetting("box_price", DEFAULT_BOX_PRICE));
    if (priceVal > 0) { DEFAULT_BOX_PRICE = priceVal; setBoxPrice(priceVal); }
    setLoaded(true);
  }, []);

  /* ===== فلترة بالتاريخ ===== */
  const [range, setRange] = useState({ from: "", to: "" });
  const dateKeyOf = (key) => (key === "bags" ? "entry_date" : key === "orders" ? "order_date" : "date");
  const inRange = useCallback((row, key) => {
    const d = row[dateKeyOf(key)];
    if (!range.from && !range.to) return true;
    if (!d) return false;
    if (range.from && d < range.from) return false;
    if (range.to && d > range.to) return false;
    return true;
  }, [range]);

  /* ===== نسخة احتياطية ===== */
  const exportBackup = () => {
    const payload = { exported_at: new Date().toISOString(), brand: BRAND_NAME, data, incoming, cancelled };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `نسخة-احتياطية-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    showToast("تم تنزيل النسخة الاحتياطية");
  };

  const exportCSV = () => {
    const lines = [];
    for (const key of Object.keys(TABLES)) {
      const cfg = TABLES[key];
      const rows = (computedRows[key] || []).filter((r) => inRange(r, key));
      if (!rows.length) continue;
      lines.push(cfg.label);
      lines.push(cfg.display.map((d) => (cfg.columns.find((cc) => cc.key === d)?.label || d)).join(","));
      rows.forEach((r) => {
        lines.push(cfg.display.map((d) => `"${String(r[d] ?? "").replace(/"/g, '""')}"`).join(","));
      });
      lines.push("");
    }
    const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `تقرير-${todayISO()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    showToast("تم تنزيل التقرير");
  };

  const changeBoxPrice = async () => {
    const v = window.prompt("سعر العلبة الجديد (درهم):", String(boxPrice));
    if (v === null) return;
    const p = num(v);
    if (p <= 0) { showToast("أدخل سعراً صحيحاً"); return; }
    await setSetting("box_price", p);
    DEFAULT_BOX_PRICE = p;
    setBoxPrice(p);
    showToast(`تم تحديث سعر العلبة إلى ${fmt(p)} درهم`);
  };

  const toggleOrders = async () => {
    const next = !ordersOpen;
    await setSetting("orders_open", next);
    setOrdersOpen(next);
    showToast(next ? "تم فتح استقبال الطلبات" : "تم إيقاف استقبال الطلبات");
  };

  useEffect(() => { loadAll(); }, [loadAll]);

  const computedRows = useMemo(() => {
    const out = {};
    for (const key of Object.keys(TABLES)) out[key] = (data[key] || []).map((r) => TABLES[key].computed(r, data));
    return out;
  }, [data]);

  const filteredRows = useMemo(() => {
    const out = {};
    for (const key of Object.keys(TABLES)) out[key] = (computedRows[key] || []).filter((r) => inRange(r, key));
    return out;
  }, [computedRows, inRange]);

  const dash = useMemo(() => computeDash(filteredRows), [filteredRows]);
  const sourceSummary = useMemo(() => computeSourceSummary(filteredRows), [filteredRows]);
  /* حسابات الشركاء تراكمية — لا تتأثر بفلتر التاريخ */
  const sourceSummaryAll = useMemo(() => computeSourceSummary(computedRows), [computedRows]);

  const partnersDistribution = useMemo(() => {
    const netFarm = sourceSummaryAll.farm.net;
    const farmBoxes = sourceSummaryAll.farm.boxes;   // علب إنتاج المزرعة
    /* العطايا من إنتاج المزرعة — تُخصم من الإجمالي قبل التقسيم (بلا مصدر = تُعد من المزرعة) */
    const farmGifts = (computedRows.gifts || [])
      .filter((g) => !g.source || g.source === "إنتاج المزرعة")
      .reduce((s, g) => s + num(g.qty), 0);
    const netBoxes = farmBoxes - farmGifts;       // الصافي القابل للتوزيع
    const partners = data.partners || [];
    const pctSum = partners.reduce((s, p) => s + num(p.pct), 0);
    const withdrawals = data.withdrawals || [];
    const valueOf = (w) => (w.type === "علب دبس" ? num(w.qty) * DEFAULT_BOX_PRICE : num(w.amount));
    return {
      netFarm, pctSum, farmBoxes, farmGifts, netBoxes,
      rows: partners.map((p) => {
        const mine = withdrawals.filter((w) => w.partner_name === p.name);
        const share = netFarm * (num(p.pct) / 100);
        const withdrawn = mine.reduce((s, w) => s + valueOf(w), 0);
        /* نصيب الشريك من العلب بعد خصم العطايا */
        const boxShare = netBoxes * (num(p.pct) / 100);
        const giftCut = farmGifts * (num(p.pct) / 100);   // ما تحمّله من العطايا
        const boxTaken = mine.filter((w) => w.type === "علب دبس").reduce((s, w) => s + num(w.qty), 0);
        return {
          ...p, share, withdrawn, remaining: share - withdrawn,
          boxShare, giftCut, boxTaken, boxLeft: boxShare - boxTaken,
        };
      }),
    };
  }, [data.partners, data.withdrawals, computedRows.gifts, sourceSummaryAll]);

  const acceptIncoming = async (item) => {
    const notesParts = [];
    if (item.notes) notesParts.push(item.notes);
    if (item.phone) notesParts.push(`هاتف: ${item.phone}`);
    notesParts.push(item.fulfillment === "توصيل" ? "توصيل" : "استلام");
    if (item.fulfillment === "توصيل") {
      const addr = [item.emirate, item.area, item.house_number ? `منزل ${item.house_number}` : "", item.delivery_location]
        .filter(Boolean).join(" - ");
      if (addr) notesParts.push(addr);
      if (num(item.delivery_fee) > 0) notesParts.push(`رسوم توصيل: ${fmt(num(item.delivery_fee))}`);
    }
    notesParts.push("(عبر الرابط الإلكتروني)");

    // نفتح نافذة واتساب مبكراً حتى لا يحجبها المتصفح بعد انتظار الشبكة
    const wa = waLink(item.phone, item);
    const waWin = wa ? window.open("", "_blank") : null;

    try {
      const created = await insertRow("orders", { order_date: todayISO(), customer_name: item.name, qty_requested: item.qty, notes: notesParts.join(" — ") });
      await supabase.from("incoming_orders")
        .update({ status: "accepted", linked_order_id: created ? created.id : null })
        .eq("id", item.id);
    } catch (err) {
      console.error(err);
      if (waWin) waWin.close();
      showToast("تعذّر قبول الطلب، حاول مرة أخرى");
      return;
    }

    setIncoming((list) => list.filter((x) => x.id !== item.id));
    await loadAll();

    if (waWin) {
      waWin.location.href = wa;
      showToast("تم قبول الطلب — أرسل التأكيد للعميل");
    } else if (wa) {
      window.location.href = wa;
    } else {
      showToast("تم قبول الطلب (لا يوجد رقم تواصل)");
    }
  };
  const cancelIncoming = async (item) => {
    if (!window.confirm(`تأكيد إلغاء طلب ${item.name}؟\nسينتقل إلى قائمة الطلبات الملغاة.`)) return;
    await supabase.from("incoming_orders").update({ status: "cancelled" }).eq("id", item.id);
    setIncoming((list) => list.filter((x) => x.id !== item.id));
    setCancelled((list) => [{ ...item, status: "cancelled" }, ...list]);
    showToast("تم إلغاء الطلب — أرسل إشعاراً للعميل من قائمة الملغاة");
  };

  const logout = async () => { await supabase.auth.signOut(); };

  if (!loaded) {
    return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.bg }}><div style={{ color: COLORS.inkSoft }}>جارِ تحميل البيانات…</div></div>;
  }

  return (
    <div dir="rtl" style={{ minHeight: "100vh", background: COLORS.bg, color: COLORS.ink }}>
      <header style={{ background: `linear-gradient(135deg, ${COLORS.deep}, #3A1C0C)`, color: "#F3E9D8", padding: "20px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <LogoMark size={42} light />
          <div>
            <div style={{ fontFamily: "Cairo, sans-serif", fontWeight: 800, fontSize: 19 }}>{BRAND_NAME}</div>
            <div style={{ fontSize: 11.5, color: "#D8C4A8" }}>{session.user.email}</div>
          </div>
        </div>
        <button onClick={logout} style={{ ...ghostBtnStyle, background: "rgba(255,255,255,.1)", color: "#F3E9D8", border: "1px solid rgba(255,255,255,.25)" }}>تسجيل خروج</button>
      </header>

      <nav style={{ background: COLORS.surface, borderBottom: `1px solid ${COLORS.line}`, overflowX: "auto", position: "sticky", top: 0, zIndex: 5 }}>
        <div style={{ display: "flex", gap: 4, padding: "6px 12px" }}>
          {TAB_ORDER.map((key) => {
            const meta = TABLES[key] ? { label: TABLES[key].label, icon: TABLES[key].icon } : TAB_META[key];
            const active = tab === key;
            const badge = key === "orders" && incoming.length > 0 ? incoming.length : 0;
            return (
              <button key={key} onClick={() => setTab(key)} style={{ position: "relative", flex: "0 0 auto", padding: "9px 14px", borderRadius: 10, border: "none", cursor: "pointer", fontSize: 13.5, fontWeight: active ? 700 : 500, background: active ? COLORS.primary : "transparent", color: active ? "#fff" : COLORS.inkSoft }}>
                {meta.icon} {meta.label}
                {badge > 0 && (
                  <span style={{
                    position: "absolute", top: 2, insetInlineEnd: 2, minWidth: 18, height: 18,
                    borderRadius: 9, background: COLORS.alert, color: "#fff", fontSize: 11, fontWeight: 800,
                    display: "inline-flex", alignItems: "center", justifyContent: "center", padding: "0 5px",
                  }}>{badge}</span>
                )}
              </button>
            );
          })}
        </div>
      </nav>

      <main style={{ maxWidth: 1100, margin: "0 auto", padding: "18px 16px 60px" }}>
        {(tab === "dashboard" || tab === "sources") && (
          <ToolsBar range={range} setRange={setRange} onExportBackup={exportBackup} onExportCSV={exportCSV} boxPrice={boxPrice} onChangePrice={changeBoxPrice} />
        )}
        {tab === "dashboard" && <Dashboard dash={dash} onReload={loadAll} />}
        {tab === "sources" && <SourceSummary summary={sourceSummary} />}
        {tab === "collect" && (
          <CollectionsPanel sales={computedRows.sales || []} onReload={loadAll} showToast={showToast} />
        )}
        {tab === "partners" && <Partners partners={data.partners} distribution={partnersDistribution} withdrawals={data.withdrawals} boughtNet={sourceSummaryAll.bought.net} boxesRows={computedRows.boxes || []} boxPrice={boxPrice} onReload={loadAll} showToast={showToast} />}
        {tab === "orders" && (
          <DeliveryPanel orders={computedRows.orders || []} sales={computedRows.sales || []} onReload={loadAll} showToast={showToast} boxPrice={boxPrice} />
        )}
        {tab === "orders" && (
          <AllocationPanel orders={computedRows.orders || []} available={dash.available} showToast={showToast} />
        )}
        {tab === "orders" && (
          <IncomingOrders incoming={incoming} cancelled={cancelled} onAccept={acceptIncoming} onCancel={cancelIncoming} ordersOpen={ordersOpen} onToggleOrders={toggleOrders} onReload={loadAll} />
        )}
        {Object.keys(TABLES).includes(tab) && (
          <DataTable tableKey={tab} config={TABLES[tab]} rows={computedRows[tab] || []} ordersRows={tab === "sales" ? computedRows.orders : undefined} onReload={loadAll} showToast={showToast} />
        )}
      </main>

      {toast && <div style={{ position: "fixed", bottom: 20, insetInlineStart: "50%", transform: "translateX(50%)", background: COLORS.deep, color: "#F3E9D8", padding: "10px 18px", borderRadius: 10, fontSize: 13 }}>{toast}</div>}
    </div>
  );
}

function StatCard({ label, value, accent, icon }) {
  return (
    <div style={{ background: COLORS.surface, borderRadius: 14, padding: "16px 18px", border: `1px solid ${COLORS.line}`, borderInlineStart: `4px solid ${accent || COLORS.primary}` }}>
      <div style={{ display: "flex", justifyContent: "space-between" }}>
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, fontWeight: 500 }}>{label}</div>
        <span>{icon}</span>
      </div>
      <div style={{ fontFamily: "Cairo, sans-serif", fontWeight: 800, fontSize: 22, marginTop: 6, color: accent || COLORS.ink }}>{value}</div>
    </div>
  );
}
function SectionTitle({ title, subtitle }) {
  return (
    <div style={{ marginBottom: 12 }}>

function siteBase() {
  return window.location.href.split("#")[0];
}

function intlPhone(phone) {
  const digits = String(phone || "").replace(/[^0-9]/g, "");
  if (!digits) return "";
  return digits.startsWith("00") ? digits.slice(2)
    : digits.startsWith("971") ? digits
    : digits.startsWith("0") ? "971" + digits.slice(1)
    : digits;
}

/* رسالة تأكيد استلام الطلب */
function waLink(phone, item) {
  const intl = intlPhone(phone);
  if (!intl) return "";
  const boxes = num(item.qty);
  const fee = num(item.delivery_fee);
  const total = boxes * DEFAULT_BOX_PRICE + fee;
  const lines = [
    `مرحباً ${item.first_name || item.name || ""} 👋`,
    "",
    "نشكر لكم طلبكم من مزرعتنا، ونفيدكم بأنه تم استلامه بنجاح.",
    "",
    `🔖 رقم الطلب: ${item.order_code || "-"}`,
    "",
    "تفاصيل الطلب:",
    `• الكمية: ${fmt(boxes)} علبة (${fmt(boxes * BOX_SIZE_KG)} كجم)`,
    `• طريقة الاستلام: ${item.fulfillment || "استلام"}`,
  ];
  if (fee > 0) lines.push(`• رسوم التوصيل: ${fmt(fee)} درهم`);
  lines.push(`• الإجمالي: ${fmt(total)} درهم`);
  lines.push("");
  lines.push("💵 الدفع عند الاستلام.");
  lines.push("");
  if (item.fulfillment === "توصيل") {
    lines.push("📍 نرجو مشاركة موقعكم عبر واتساب (Location) مع رقم المنزل، لتسهيل وصول المندوب إليكم.");
    lines.push("");
  }
  lines.push("نظراً لأن الإنتاج طبيعي ويعتمد على عوامل عدة، سيتم التواصل معكم لتحديد موعد التسليم فور توفر الكمية بإذن الله.");
  lines.push("");
  lines.push("لإلغاء الطلب في أي وقت، اضغط الرابط التالي (مع ذكر السبب إن رغبتم):");
  lines.push(`${siteBase()}#cancel=${item.order_code || ""}`);
  lines.push("");
  lines.push("شاكرين لكم حسن تعاملكم 🌴");
  return `https://wa.me/${intl}?text=${encodeURIComponent(lines.join("\n"))}`;
}

/* رسالة إشعار بإلغاء الطلب */
function waCancelLink(phone, item) {
  const intl = intlPhone(phone);

  ];
  return `https://wa.me/${intl}?text=${encodeURIComponent(lines.join("\n"))}`;
}

/* ============ أنصبة الشركاء لكل قطفة ============ */

function PartnerBatches({ partners, boxesRows, withdrawals, farmGifts, boxPrice, showToast }) {
  const [who, setWho] = useState("");   // "" = كل الشركاء

  /* قطفات إنتاج المزرعة فقط، الأحدث أولاً */
  const batches = useMemo(
    () => (boxesRows || [])
      .filter((b) => b.source === "إنتاج المزرعة" && num(b.box_count) > 0)
      .sort((a, b) => String(b.date || "").localeCompare(String(a.date || ""))),
    [boxesRows]
  );

  const totalBoxes = batches.reduce((s, b) => s + num(b.box_count), 0);
  const gifts = num(farmGifts);
  const netTotal = totalBoxes - gifts;   // بعد خصم العطايا
  const shown = who ? partners.filter((p) => p.name === who) : partners;

  /* نصيب شريك من قطفة */
  const shareOf = (batch, p) => num(batch.box_count) * (num(p.pct) / 100);

  /* ما استلمه الشريك فعلاً كعلب */
  const takenOf = (p) => (withdrawals || [])
    .filter((w) => w.partner_name === p.name && w.type === "علب دبس")
    .reduce((s, w) => s + num(w.qty), 0);

  const copyPlan = (p) => {
    const lines = batches
      .map((b) => `• ${b.date || "بدون تاريخ"}: ${fmt(shareOf(b, p), 1)} علبة (من ${fmt(b.box_count)})`)
      .filter(Boolean);
    if (!lines.length) { showToast("لا توجد قطفات مسجّلة"); return; }
    const total = netTotal * (num(p.pct) / 100);
    navigator.clipboard?.writeText([
      `نصيب ${p.name} (${fmt(p.pct, 2)}%)`, "", ...lines, "",
      `الإجمالي: ${fmt(total, 1)} علبة`,
      `قيمتها لو بيعت: ${fmt(total * boxPrice)} درهم`,
    ].join("\n"));
    showToast(`تم نسخ كشف ${p.name}`);
  };

  if (!batches.length) {
    return (
      <div style={{
        background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 14,
        padding: "20px 16px", marginBottom: 18, textAlign: "center",
        color: COLORS.inkSoft, fontSize: 13,
      }}>
        سجّل إنتاج علب من «إنتاج المزرعة» ليظهر نصيب كل شريك من كل قطفة.
      </div>
    );
  }

  return (
    <div style={{ marginBottom: 22 }}>
      <SectionTitle title="نصيب الشركاء من كل قطفة"
        subtitle={`${batches.length} قطفة · ${fmt(totalBoxes)} علبة إنتاجاً${gifts > 0 ? ` · ${fmt(netTotal)} صافي بعد العطايا` : ""}`} />

      {/* اختيار الشريك */}
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
        <button onClick={() => setWho("")} style={{
          ...ghostBtnStyle, padding: "7px 14px", fontSize: 12,
          background: who === "" ? COLORS.deep : "#fff",
          color: who === "" ? "#F3E9D8" : COLORS.inkSoft,
          borderColor: who === "" ? COLORS.deep : COLORS.line,
        }}>كل الشركاء</button>
        {partners.map((p) => (
          <button key={p.id} onClick={() => setWho(p.name)} style={{
            ...ghostBtnStyle, padding: "7px 14px", fontSize: 12,
            background: who === p.name ? COLORS.primary : "#fff",
            color: who === p.name ? "#fff" : COLORS.inkSoft,
            borderColor: who === p.name ? COLORS.primary : COLORS.line,
          }}>{p.name}</button>
        ))}
      </div>

      {/* جدول القطفات */}
      <div style={{ background: COLORS.surface, borderRadius: 14, border: `1px solid ${COLORS.line}`, overflow: "auto" }}>
        <table>
          <thead>
            <tr>
              <th>القطفة</th>
              <th>إجمالي العلب</th>
              {shown.map((p) => <th key={p.id}>{p.name} ({fmt(p.pct, 1)}%)</th>)}
            </tr>
          </thead>
          <tbody>
            {batches.map((b) => (
              <tr key={b.id}>
                <td style={{ fontWeight: 600 }}>{b.date || "—"}</td>
                <td>{fmt(b.box_count)}</td>
                {shown.map((p) => (
                  <td key={p.id} style={{ fontWeight: 700, color: COLORS.deep }}>
                    {fmt(shareOf(b, p), 1)}
                  </td>
                ))}
              </tr>
            ))}
            <tr style={{ background: COLORS.bg }}>
              <td style={{ fontWeight: 700 }}>إجمالي الإنتاج</td>
              <td style={{ fontWeight: 700 }}>{fmt(totalBoxes)}</td>
              {shown.map((p) => (
                <td key={p.id} style={{ fontWeight: 700, color: COLORS.inkSoft }}>
                  {fmt(totalBoxes * (num(p.pct) / 100), 1)}
                </td>
              ))}
            </tr>
            {gifts > 0 && (
              <tr style={{ background: "#FBEAE8" }}>
                <td style={{ fontWeight: 700, color: COLORS.alert }}>🎁 ناقص العطايا</td>
                <td style={{ fontWeight: 700, color: COLORS.alert }}>− {fmt(gifts)}</td>
                {shown.map((p) => (
                  <td key={p.id} style={{ fontWeight: 700, color: COLORS.alert }}>
                    − {fmt(gifts * (num(p.pct) / 100), 1)}
                  </td>
                ))}
              </tr>
            )}
            <tr style={{ background: "rgba(107,122,58,.12)" }}>
              <td style={{ fontWeight: 800 }}>الصافي لكل شريك</td>
              <td style={{ fontWeight: 800 }}>{fmt(netTotal)}</td>
              {shown.map((p) => (
                <td key={p.id} style={{ fontWeight: 800, color: COLORS.secondary }}>
                  {fmt(netTotal * (num(p.pct) / 100), 1)}
                </td>
              ))}
            </tr>
          </tbody>
        </table>
      </div>

      {/* خيار الشريك: علب أو بيع */}
      <div style={{ display: "grid", gap: 9, marginTop: 14 }}>
        {shown.map((p) => {
          const total = netTotal * (num(p.pct) / 100);
          const taken = takenOf(p);
          const left = total - taken;
          return (
            <div key={p.id} style={{
              background: COLORS.surface, border: `1px solid ${COLORS.line}`,
              borderInlineStart: `4px solid ${COLORS.primary}`,
              borderRadius: 12, padding: "12px 14px",
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                <div style={{ fontWeight: 800, fontSize: 14, color: COLORS.deep }}>{p.name}</div>
                <button onClick={() => copyPlan(p)} style={{ ...ghostBtnStyle, padding: "6px 12px", fontSize: 11.5 }}>
                  📋 نسخ كشفه
                </button>
              </div>
              <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginTop: 7, lineHeight: 2 }}>
                نصيبه <b style={{ color: COLORS.deep }}>{fmt(total, 1)} علبة</b>
                {taken > 0 && <> · استلم <b style={{ color: COLORS.primary }}>{fmt(taken)}</b></>}
                <br />
                <span style={{ color: COLORS.secondary }}>
                  🏠 لو أخذها علب: <b>{fmt(left, 1)} علبة</b> متاحة له
                </span>
                <br />
                <span style={{ color: COLORS.primary }}>
                  💰 لو باعها: <b>{fmt(left * boxPrice)} درهم</b> ({fmt(left, 1)} × {fmt(boxPrice)})
                </span>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{
        background: COLORS.amberLight, borderRadius: 10, padding: "11px 14px",
        fontSize: 11.5, color: COLORS.deep, marginTop: 12, lineHeight: 2,
      }}>
        <b>كيف تسجّلها:</b> إذا أخذ الشريك نصيبه علباً — سجّل سحباً من نوع «علب دبس» بالكمية.
        وإذا اختار البيع — اترك العلب بالمخزن تُباع عادي، ثم سجّل له سحباً «نقدي» بقيمتها عند التسليم.
      </div>
    </div>
  );
}
function Partners({ partners, distribution, withdrawals, boughtNet, boxesRows, boxPrice, onReload, showToast }) {
  const [wForm, setWForm] = useState({ date: todayISO(), partner_name: "", type: "نقدي", qty: "", amount: "", notes: "" });
  const [showForm, setShowForm] = useState(false);

  const updatePartner = async (p, field, value) => {
    await updateRow("partners", p.id, { [field]: field === "pct" ? num(value) : value });
    onReload();
  };
  const addPartner = async () => { await insertRow("partners", { name: `شريك ${partners.length + 1}`, pct: 0 }); onReload(); };
  const removePartner = async (id) => { await deleteRow("partners", id); onReload(); };

  const submitW = async (e) => {
    e.preventDefault();
    await insertRow("withdrawals", { date: wForm.date, partner_name: wForm.partner_name, type: wForm.type, qty: wForm.type === "علب دبس" ? num(wForm.qty) : null, amount: wForm.type === "نقدي" ? num(wForm.amount) : null, notes: wForm.notes });
    setWForm({ date: todayISO(), partner_name: "", type: "نقدي", qty: "", amount: "", notes: "" });
    setShowForm(false);
    onReload();
    showToast("تم تسجيل السحب");
  };
  const removeW = async (id) => { await deleteRow("withdrawals", id); onReload(); showToast("تم الحذف"); };
  const valueOf = (w) => (w.type === "علب دبس" ? num(w.qty) * DEFAULT_BOX_PRICE : num(w.amount));

  return (
    <div>
      <SectionTitle title="توزيع أرباح إنتاج المزرعة" />

      {/* معادلة التوزيع */}
      <div style={{
        background: `linear-gradient(135deg, ${COLORS.deep}, #3A1C0C)`, color: "#F3E9D8",
        borderRadius: 14, padding: "16px 18px", marginBottom: 16,
      }}>
        <div style={{ fontSize: 12, color: "#D8C4A8", marginBottom: 10 }}>الكمية القابلة للتوزيع على الشركاء</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", fontSize: 13 }}>
          <div>
            <div style={{ color: "#C9B393", fontSize: 11 }}>إنتاج المزرعة</div>
            <div style={{ fontFamily: "Cairo, sans-serif", fontWeight: 800, fontSize: 20 }}>{fmt(distribution.farmBoxes)}</div>
          </div>
          <span style={{ fontSize: 18, color: "#C9B393" }}>−</span>
          <div>
            <div style={{ color: "#C9B393", fontSize: 11 }}>عطايا المزرعة 🎁</div>
            <div style={{ fontFamily: "Cairo, sans-serif", fontWeight: 800, fontSize: 20, color: "#E8A79C" }}>{fmt(distribution.farmGifts)}</div>
          </div>
          <span style={{ fontSize: 18, color: "#C9B393" }}>=</span>
          <div>
            <div style={{ color: "#C9B393", fontSize: 11 }}>الصافي للتوزيع</div>
            <div style={{ fontFamily: "Cairo, sans-serif", fontWeight: 800, fontSize: 24, color: "#B9D189" }}>{fmt(distribution.netBoxes)} علبة</div>
          </div>
        </div>
        {distribution.farmGifts > 0 && (
          <div style={{ fontSize: 11.5, color: "#C9B393", marginTop: 10, lineHeight: 1.8 }}>
            العطايا تُخصم من الجميع بالتناسب قبل التقسيم.
          </div>
        )}
        {distribution.farmBoxes === 0 && (
          <div style={{
            background: "rgba(232,167,156,.18)", borderRadius: 9, padding: "9px 12px",
            fontSize: 11.5, color: "#E8A79C", marginTop: 12, lineHeight: 1.9,
          }}>
            ⚠️ لا يوجد إنتاج علب مسجّل من «إنتاج المزرعة».
            افتح تبويب «إنتاج العلب» وتأكد أن المصدر مضبوط على «إنتاج المزرعة» وأن عدد العلب مُدخل.
          </div>
        )}
      </div>

      <div style={{ display: "grid", gap: 10, marginBottom: 16 }}>
        {partners.map((p, i) => {
          const row = distribution.rows[i] || { share: 0, withdrawn: 0, remaining: 0, boxShare: 0, boxTaken: 0, boxLeft: 0, giftCut: 0 };
          return (
            <div key={p.id} style={{ background: COLORS.surface, borderRadius: 14, border: `1px solid ${COLORS.line}`, padding: 14 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                <input defaultValue={p.name} onBlur={(e) => updatePartner(p, "name", e.target.value)} style={{ ...inputStyle, flex: "1 1 140px" }} />
                <input type="number" defaultValue={p.pct} onBlur={(e) => updatePartner(p, "pct", e.target.value)} style={{ ...inputStyle, width: 80 }} />
                <span style={{ fontSize: 13 }}>%</span>
                <button onClick={() => {
                  if (!printPartnerStatement(p, row, withdrawals)) showToast("اسمح بالنوافذ المنبثقة للطباعة");
                }} style={{ ...ghostBtnStyle, padding: "6px 12px", fontSize: 12 }}>🖨️ كشف حساب</button>
                <button onClick={() => removePartner(p.id)} style={dangerBtnStyle}>حذف</button>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 8, marginTop: 10, fontSize: 12.5 }}>
                <div><div style={{ color: COLORS.inkSoft }}>المستحق</div><div style={{ fontWeight: 700, color: COLORS.secondary }}>{fmt(row.share)}</div></div>
                <div><div style={{ color: COLORS.inkSoft }}>المسحوب</div><div style={{ fontWeight: 700, color: COLORS.primary }}>{fmt(row.withdrawn)}</div></div>
                <div><div style={{ color: COLORS.inkSoft }}>المتبقي</div><div style={{ fontWeight: 800, color: row.remaining >= 0 ? COLORS.secondary : COLORS.alert }}>{fmt(row.remaining)}</div></div>
              </div>

              {/* نصيب الشريك من العلب المنتجة */}
              <div style={{
                display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 8,
                marginTop: 10, paddingTop: 10, fontSize: 12.5,
                borderTop: `1px dashed ${COLORS.line}`,
              }}>
                <div>
                  <div style={{ color: COLORS.inkSoft }}>نصيبه من العلب 📦</div>
                  <div style={{ fontWeight: 700, color: COLORS.deep }}>{fmt(row.boxShare, 1)} علبة</div>
                </div>
                <div>
                  <div style={{ color: COLORS.inkSoft }}>استلم علب</div>
                  <div style={{ fontWeight: 700, color: COLORS.primary }}>{fmt(row.boxTaken)}</div>
                </div>
                <div>
                  <div style={{ color: COLORS.inkSoft }}>باقي له</div>
                  <div style={{ fontWeight: 800, color: row.boxLeft >= 0 ? COLORS.secondary : COLORS.alert }}>{fmt(row.boxLeft, 1)}</div>
                </div>
              </div>
              {row.giftCut > 0 && (
                <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 8, lineHeight: 1.8 }}>
                  🎁 تحمّل من العطايا: <b style={{ color: COLORS.alert }}>{fmt(row.giftCut, 1)} علبة</b> (مخصومة من نصيبه أعلاه)
                </div>
              )}
            </div>
          );
        })}
        <button onClick={addPartner} style={primaryBtnStyle}>+ إضافة شريك</button>
      </div>

      <PartnerBatches partners={partners} boxesRows={boxesRows} withdrawals={withdrawals}
        farmGifts={distribution.farmGifts} boxPrice={boxPrice || DEFAULT_BOX_PRICE} showToast={showToast} />

      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
        <SectionTitle title="سحوبات الشركاء" />
        <button onClick={() => setShowForm((v) => !v)} style={primaryBtnStyle}>+ تسجيل سحب</button>
      </div>
      {showForm && (
        <form onSubmit={submitW} style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 14, padding: 16, marginBottom: 16 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 10 }}>
            <input type="date" value={wForm.date} onChange={(e) => setWForm((f) => ({ ...f, date: e.target.value }))} style={inputStyle} />
            <select value={wForm.partner_name} onChange={(e) => setWForm((f) => ({ ...f, partner_name: e.target.value }))} style={inputStyle}>
              <option value="">— الشريك —</option>
              {partners.map((p) => <option key={p.id} value={p.name}>{p.name}</option>)}
            </select>
            <select value={wForm.type} onChange={(e) => setWForm((f) => ({ ...f, type: e.target.value }))} style={inputStyle}>
              {WITHDRAWAL_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
            </select>
            {wForm.type === "علب دبس" ? (
              <input type="number" placeholder="الكمية (علبة)" value={wForm.qty} onChange={(e) => setWForm((f) => ({ ...f, qty: e.target.value }))} style={inputStyle} />
            ) : (
              <input type="number" placeholder="المبلغ" value={wForm.amount} onChange={(e) => setWForm((f) => ({ ...f, amount: e.target.value }))} style={inputStyle} />
            )}
            <input placeholder="ملاحظات" value={wForm.notes} onChange={(e) => setWForm((f) => ({ ...f, notes: e.target.value }))} style={inputStyle} />
          </div>
          <button type="submit" style={{ ...primaryBtnStyle, marginTop: 12 }}>تسجيل</button>
        </form>
      )}
      <div style={{ background: COLORS.surface, borderRadius: 14, border: `1px solid ${COLORS.line}`, overflow: "auto" }}>
        <table>
          <thead><tr><th>التاريخ</th><th>الشريك</th><th>النوع</th><th>الكمية/المبلغ</th><th>القيمة</th><th></th></tr></thead>
          <tbody>
            {(withdrawals || []).map((w) => (
              <tr key={w.id}>
                <td>{w.date}</td><td>{w.partner_name}</td><td>{w.type}</td>
                <td>{w.type === "علب دبس" ? `${fmt(w.qty)} علبة` : fmt(w.amount)}</td>
                <td style={{ fontWeight: 700, color: COLORS.primary }}>{fmt(valueOf(w))}</td>
                <td><button onClick={() => removeW(w.id)} style={dangerBtnStyle}>حذف</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div style={{ marginTop: 20 }}>
        <SectionTitle title="أرباح التمور المشتراة" subtitle="تعود بالكامل لناصر" />
        <StatCard label="صافي العائد" value={fmt(boughtNet)} icon="🤝" accent={boughtNet >= 0 ? COLORS.secondary : COLORS.alert} />
      </div>
    </div>
  );
}

function emptyForm(config) {
  const f = {};
  config.columns.forEach((c) => { f[c.key] = c.default !== undefined ? c.default : c.type === "date" ? todayISO() : ""; });
  return f;
}

function DataTable({ tableKey, config, rows, ordersRows, onReload, showToast }) {
  const [form, setForm] = useState(emptyForm(config));
  const [editingId, setEditingId] = useState(null);
  const [showForm, setShowForm] = useState(false);

  useEffect(() => { setForm(emptyForm(config)); setEditingId(null); setShowForm(false); }, [tableKey]);

  const resetForm = () => { setForm(emptyForm(config)); setEditingId(null); setShowForm(false); };
  const startEdit = (row) => {
    const f = emptyForm(config);
    config.columns.forEach((c) => { if (row[c.key] !== undefined && row[c.key] !== null) f[c.key] = row[c.key]; });
    setForm(f); setEditingId(row.id); setShowForm(true);
  };

  const submit = async (e) => {
    e.preventDefault();
    const payload = {};
    config.columns.forEach((c) => {
      let v = form[c.key];
      if (c.type === "number") v = v === "" ? null : num(v);
      if (v === "") v = null;
      payload[c.key] = v;
    });
    try {
      if (editingId != null) { await updateRow(config.table, editingId, payload); showToast("تم حفظ التعديل"); }
      else { await insertRow(config.table, payload); showToast("تمت الإضافة"); }
      resetForm();
      onReload();
    } catch (err) { console.error(err); showToast("حدث خطأ، حاول مرة أخرى"); }
  };
  const remove = async (id) => { await deleteRow(config.table, id); onReload(); showToast("تم الحذف"); };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <SectionTitle title={config.label} subtitle={`${rows.length} سجل`} />
        <button style={primaryBtnStyle} onClick={() => { resetForm(); setShowForm(true); }}>+ إضافة</button>
      </div>

      {showForm && (
        <form onSubmit={submit} style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 14, padding: 16, marginBottom: 16 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", gap: 10 }}>
            {config.columns.map((c) => (
              <label key={c.key} style={{ fontSize: 12, color: COLORS.inkSoft }}>
                {c.label}
                {c.type === "select" ? (
                  <select value={form[c.key] ?? ""} onChange={(e) => setForm((f) => ({ ...f, [c.key]: e.target.value }))} style={{ ...inputStyle, marginTop: 4 }} required={c.required}>
                    <option value="">— اختر —</option>
                    {c.options.map((o) => <option key={o} value={o}>{o}</option>)}
                  </select>
                ) : c.type === "orderLink" ? (
                  <select value={form[c.key] ?? ""} onChange={(e) => {
                    const orderId = e.target.value ? parseInt(e.target.value) : "";
                    const order = (ordersRows || []).find((o) => o.id === orderId);
                    setForm((f) => ({ ...f, [c.key]: orderId, customer: order ? order.customer_name : f.customer }));
                  }} style={{ ...inputStyle, marginTop: 4 }}>
                    <option value="">بدون طلب (بيع مباشر)</option>
                    {(ordersRows || []).map((o) => <option key={o.id} value={o.id}>#{o.id} — {o.customer_name} (متبقٍ {fmt(o.remaining)})</option>)}
                  </select>
                ) : (
                  <input type={c.type === "number" ? "number" : c.type === "date" ? "date" : "text"} value={form[c.key] ?? ""} onChange={(e) => setForm((f) => ({ ...f, [c.key]: e.target.value }))} style={{ ...inputStyle, marginTop: 4 }} required={c.required} />
                )}
              </label>
            ))}
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
            <button type="submit" style={primaryBtnStyle}>{editingId != null ? "حفظ" : "إضافة"}</button>
            <button type="button" onClick={resetForm} style={ghostBtnStyle}>إلغاء</button>
          </div>
        </form>
      )}

      <div style={{ background: COLORS.surface, borderRadius: 14, border: `1px solid ${COLORS.line}`, overflow: "auto" }}>
        {rows.length === 0 ? (
          <div style={{ padding: "30px 16px", textAlign: "center", color: COLORS.inkSoft, fontSize: 13.5 }}>لا توجد سجلات بعد.</div>
        ) : (
          <table>
            <thead><tr>{config.display.map((c) => <th key={c}>{config.columns.find((cc) => cc.key === c)?.label || c}</th>)}<th></th></tr></thead>
            <tbody>
              {rows.map((row) => (
                <tr key={row.id}>
                  {config.display.map((c) => (
                    <td key={c}>{typeof row[c] === "number" ? fmt(row[c], Number.isInteger(row[c]) ? 0 : 2) : (row[c] ?? "")}</td>
                  ))}
                  <td>
                    <button onClick={() => startEdit(row)} style={{ ...dangerBtnStyle, color: COLORS.primary }}>تعديل</button>
                    <button onClick={() => remove(row.id)} style={dangerBtnStyle}>حذف</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ============ الجذر: تسجيل الدخول / رابط العميل / التطبيق ============ */
function Root() {
  const [session, setSession] = useState(undefined);
  const [hash, setHash] = useState(window.location.hash);

  useEffect(() => {
    const onHash = () => setHash(window.location.hash);
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = supabase.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  if (hash.startsWith("#cancel")) {
    const t = (hash.split("=")[1] || "").trim();
    return <CancelOrderPage token={t} />;
  }
  if (hash === "#story") return <StoryPage />;
  if (hash === "#order") return <CustomerOrderForm />;
  if (session === undefined) return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.bg }}>جارِ التحقق…</div>;
  if (!session) return <LoginScreen />;
  return <MainApp session={session} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
